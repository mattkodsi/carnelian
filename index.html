<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carnelian</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnelian">
<meta name="theme-color" content="#A81F23">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='6' width='88' height='88' rx='22' fill='%23A81F23'/><text x='50' y='53' font-size='62' font-weight='800' fill='%23fff' text-anchor='middle' dominant-baseline='central' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif'>C</text></svg>">
<style>
  :root{
    --bg:#FAF7F4; --surface:#FFFFFF; --surface-2:#F4EFEA; --surface-3:#EFE8E2;
    --line:#EBE3DC; --line-strong:#DCD1C8; --ink:#1E1A18; --ink-2:#6C625B; --ink-3:#786D64;
    --accent:#A81F23; --accent-ink:#FFFFFF; --accent-soft:#F8E9E7; --accent-line:#E9C9C6;
    /* vivid --ok/--warn/--plan are FILLS (bars, dots, cells); --*-ink are the darker text shades that pass AA */
    --ok:#2E8B57; --ok-ink:#217043; --ok-bg:#E4F1E9; --ok-line:#BFE0CC; --warn:#B9770F; --warn-ink:#8C590B; --warn-bg:#F8EDD6; --warn-line:#EAD3A0;
    --plan:#39699F; --plan-ink:#345F90; --plan-bg:#E7EEF6; --plan-line:#C7D8EA;
    --ev-strength:91%; --ev-mixc:#000000; --ev-ink:#fff; --ev-ink2:rgba(255,255,255,.93); --ev-ink3:rgba(255,255,255,.85); --ev-title:#fff;
    --ev-bd-mix:#000 12%; --ev-bl-mix:#000 30%; --ev-shadow:0 1px 3px rgba(30,20,12,.18);
    --sched-band:color-mix(in srgb, var(--ink) 3.5%, transparent); --sched-line:color-mix(in srgb, var(--ink) 7%, transparent);
    --shadow:0 1px 2px rgba(60,40,30,.04), 0 12px 30px -18px rgba(80,40,30,.28);
    --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
    --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
    --r:14px; --r-sm:10px; color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#131317; --surface:#1C1C22; --surface-2:#24242B; --surface-3:#2D2D35;
    --line:#302F39; --line-strong:#41404C; --ink:#F1EFF5; --ink-2:#ABA7B5; --ink-3:#918D9B;
    --accent:#F0665F; --accent-ink:#1a0f0e; --accent-soft:#2B1A1C; --accent-line:#4B2A2C;
    --ok:#5FBE86; --ok-ink:#5FBE86; --ok-bg:#152318; --ok-line:#274633; --warn:#E4AC55; --warn-ink:#E4AC55; --warn-bg:#241E12; --warn-line:#463819;
    --plan:#7FA9DB; --plan-ink:#7FA9DB; --plan-bg:#141F2C; --plan-line:#273E54;
    --ev-strength:40%; --ev-mixc:var(--surface); --ev-ink:var(--ink); --ev-ink2:var(--ink-2); --ev-ink3:var(--ink-3); --ev-title:color-mix(in srgb, var(--h) 80%, var(--ink));
    --ev-bd-mix:var(--surface) 34%; --ev-bl-mix:#000 0%; --ev-shadow:none;
    --sched-band:color-mix(in srgb, var(--ink) 5%, transparent); --sched-line:color-mix(in srgb, var(--ink) 11%, transparent);
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 14px 34px -18px rgba(0,0,0,.72); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#131317; --surface:#1C1C22; --surface-2:#24242B; --surface-3:#2D2D35;
    --line:#302F39; --line-strong:#41404C; --ink:#F1EFF5; --ink-2:#ABA7B5; --ink-3:#918D9B;
    --accent:#F0665F; --accent-ink:#1a0f0e; --accent-soft:#2B1A1C; --accent-line:#4B2A2C;
    --ok:#5FBE86; --ok-ink:#5FBE86; --ok-bg:#152318; --ok-line:#274633; --warn:#E4AC55; --warn-ink:#E4AC55; --warn-bg:#241E12; --warn-line:#463819;
    --plan:#7FA9DB; --plan-ink:#7FA9DB; --plan-bg:#141F2C; --plan-line:#273E54;
    --ev-strength:40%; --ev-mixc:var(--surface); --ev-ink:var(--ink); --ev-ink2:var(--ink-2); --ev-ink3:var(--ink-3); --ev-title:color-mix(in srgb, var(--h) 80%, var(--ink));
    --ev-bd-mix:var(--surface) 34%; --ev-bl-mix:#000 0%; --ev-shadow:none;
    --sched-band:color-mix(in srgb, var(--ink) 5%, transparent); --sched-line:color-mix(in srgb, var(--ink) 11%, transparent);
    --shadow:0 1px 2px rgba(0,0,0,.34), 0 14px 34px -18px rgba(0,0,0,.72); color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{margin:0}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5; font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0; letter-spacing:-.02em; font-family:var(--font-display)}
  button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
  input,select{font-family:inherit; font-size:14px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
  .code{font-weight:700; letter-spacing:.005em}

  /* ---- gate ---- */
  .gate{position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:var(--bg); z-index:100}
  .gatecard{width:100%; max-width:340px; text-align:center}
  .gatecard .mark{width:52px;height:52px;border-radius:15px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;margin:0 auto 16px}
  .gatecard h1{font-size:22px; font-weight:800}
  .gatecard p{color:var(--ink-2); font-size:13px; margin:8px 0 20px}
  .gatecard input{width:100%; padding:13px 14px; border:1px solid var(--line-strong); border-radius:11px; background:var(--surface); color:var(--ink); text-align:center; letter-spacing:.35em; font-size:20px; margin-bottom:10px}
  .gatecard button{width:100%; padding:13px; border-radius:11px; background:var(--accent); color:#fff; font-weight:700}
  .gatecard .msg{font-size:12.5px; margin-top:12px; min-height:18px} .gatecard .msg.err{color:var(--accent)}

  /* ---- shell ---- */
  .app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
  /* Schedule page: freeze the document so nothing scrolls behind the fixed grid */
  html.schedlock{overflow:hidden} html.schedlock body{overflow:hidden}
  .rail{background:var(--surface); border-right:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:14px; position:sticky; top:0; height:100vh; overflow:auto}
  .brand{display:flex; align-items:center; gap:10px; padding:2px 6px}
  .brand .mk{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
  .brand .wm{font-weight:800; letter-spacing:-.02em; font-size:17px; font-family:var(--font-display)}
  .gpas{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .gpa{border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 10px; background:var(--surface)}
  .gpa .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--ink-3)}
  .gpa .v{font-size:20px;font-weight:800;letter-spacing:-.02em} .gpa .v small{font-size:11px;color:var(--ink-3);font-weight:600}
  .nav{display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:left;width:100%}
  .navitem svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7}
  .navitem:hover{background:var(--surface-2);color:var(--ink)} .navitem.on{background:var(--accent-soft);color:var(--accent)}
  .rail-foot{margin-top:auto;display:flex;gap:8px;padding:6px;flex-wrap:wrap}
  .tbtn{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
  .tbtn:hover{background:var(--surface-2);color:var(--ink)}

  .main{min-width:0;padding:26px 30px 60px}
  .main.fit{padding-bottom:0}   /* schedule page fits the viewport; no scroll padding */
  .phead{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .phead h1{font-size:26px;font-weight:800}
  .phead .actions{margin-left:auto;display:flex;gap:9px}
  .canvas-stat{width:100%;margin:-10px 2px 16px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
  .ph-note{font-size:11.5px;color:var(--ink-3);font-weight:600;width:100%;margin-top:-8px}
  .pback{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--ink-3);padding:2px 2px 2px 0;margin-bottom:12px;background:none;border:none}
  .pback:hover{color:var(--ink)} .pback:active{opacity:.6}
  /* iOS-style edge-swipe back: while dragging, the transcript and dashboard become stacked
     fixed layers so the transcript can slide off to the right and reveal the dashboard. */
  @media (max-width:760px){
    .main.swiping>#transcript,.main.swiping>#dashboard{position:fixed;inset:0;margin:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
      padding:calc(60px + env(safe-area-inset-top)) 15px calc(108px + env(safe-area-inset-bottom));background:var(--bg)}
    .main.swiping>#transcript{z-index:20;will-change:transform;box-shadow:-10px 0 26px rgba(0,0,0,.16)}
    .main.swiping>#dashboard{z-index:10}
  }
  .fab{position:fixed;right:20px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:28px;font-weight:400;display:none;align-items:center;justify-content:center;box-shadow:0 8px 22px -6px rgba(120,20,20,.5);z-index:55;border:0;line-height:1}
  .fab:active{transform:scale(.94)}
  .btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border-radius:9px;padding:9px 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
  .btn:hover{background:var(--surface-2)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .page{display:none} .page.on{display:block}
  .muted{color:var(--ink-3)}

  /* ---- dashboard: stat strip ---- */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:20px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--ink-3)}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .stat .v small{font-size:12px;color:var(--ink-3);font-weight:700}
  .stat .sub{font-size:11.5px;color:var(--ink-2);margin-top:3px;font-weight:600}
  .stat .sub.warnsub{color:var(--accent)}
  .stat.tap{position:relative;cursor:pointer;transition:transform .08s ease,border-color .12s ease}
  .stat.tap:hover{border-color:var(--line-strong)} .stat.tap:active{transform:scale(.985)}
  .stat.tap .tap-c{position:absolute;top:11px;right:13px;font-size:17px;font-weight:700;line-height:1;color:var(--ink-3);opacity:.6}

  /* ---- degree card ---- */
  .degree{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .degree .dh{display:flex;align-items:center;gap:14px;padding:15px 17px}
  .degree .ring{position:relative;width:52px;height:52px;flex:0 0 auto}
  .degree .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
  .degree .dt{min-width:0;flex:1}
  .degree .dt .nm{font-size:16.5px;font-weight:800;font-family:var(--font-display)}
  .degree .dt .mt{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:2px}
  /* GPA folded into each degree header — kept large and beside the degree it belongs to */
  .degree .dgpa{flex:0 0 auto;text-align:right;background:none;border:0;padding:3px 3px 3px 10px;cursor:pointer;border-radius:9px;transition:background .12s}
  .degree .dgpa:hover{background:var(--surface-2)}
  .degree .dgpa .k{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--ink-3)}
  .degree .dgpa .v{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:1px}
  .degree .rows{border-top:1px solid var(--line)}
  .drow{display:flex;align-items:center;gap:11px;padding:11px 17px;border-top:1px solid var(--line);width:100%;text-align:left}
  .drow:first-child{border-top:0}
  .drow:hover{background:var(--surface-2)}
  .drow .dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto}
  .drow .nm{font-weight:700;font-size:13px}
  .drow .sub{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:1px}
  .drow .mini{width:66px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;flex:0 0 auto;margin-left:auto;display:flex}
  .drow .mini i{display:block;height:100%}
  .drow .rt{font-weight:800;font-size:12px;flex:0 0 auto;width:52px;text-align:right}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.plan{background:var(--plan)} .dot.none{background:var(--surface-3);border:1.5px solid var(--line-strong)}
  .fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.plan{background:var(--plan)} .fill.planned{background:var(--warn);opacity:.32}
  .c-ok{color:var(--ok-ink)} .c-warn{color:var(--warn-ink)} .c-ink3{color:var(--ink-3)}

  /* ---- "what's left" ---- */
  .sect-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:22px 2px 10px}
  .todo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .titem{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
  .titem:first-child{border-top:0} .titem:hover{background:var(--surface-2)}
  .titem .nm{font-weight:700;font-size:13px} .titem .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .titem .amt{margin-left:auto;font-weight:800;font-size:12px;color:var(--warn-ink);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .done-note{display:flex;align-items:center;gap:9px;padding:14px 16px;color:var(--ok-ink);font-weight:700;font-size:13px}

  /* ---- requirements tree ---- */
  .pgroup{margin-bottom:12px}
  .pgroup .gh{display:flex;align-items:center;gap:11px;padding:6px 4px 12px}
  .pgroup .gh .nm{font-size:18px;font-weight:800;font-family:var(--font-display)}
  .pgroup .gh .rt{margin-left:auto;font-weight:800;font-size:13px}
  .subhead{font-size:12.5px;font-weight:800;color:var(--ink-2);margin:12px 2px 8px;display:flex;align-items:center;gap:8px}
  .subhead .dot{width:8px;height:8px;border-radius:99px}
  .indent{padding-left:12px;border-left:2px solid var(--line);margin-left:3px}
  .req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow)}
  .req .bh{display:flex;align-items:center;gap:11px;padding:13px 15px;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .req .bh:hover{background:var(--surface-2)}
  .req .chev{width:11px;color:var(--ink-3);transition:transform .2s;flex:0 0 auto} .req.open .chev{transform:rotate(90deg)}
  /* name flexes to fill so the bar + count sit in fixed, aligned right-hand columns */
  .req .nm{font-weight:800;font-size:13.5px;flex:1 1 auto;min-width:0;line-height:1.25}
  .req.met .nm{color:var(--ok-ink)}   /* completed requirement → green name, matching the major/minor/distribution rows */
  .req .cr{font-weight:800;font-size:12.5px;flex:0 0 auto;width:62px;text-align:right;font-variant-numeric:tabular-nums}
  .req .mini{width:58px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;flex:0 0 auto;display:flex} .req .mini i{display:block;height:100%}
  .req .edit{flex:0 0 auto;color:var(--ink-3);font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px}
  .req .edit:hover{background:var(--surface-3);color:var(--ink)}
  .req .body{border-top:1px solid var(--line);padding:4px 15px 11px;display:none} .req.open .body{display:block}
  .crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .crow:last-child{border-bottom:0} .crow .co{font-weight:700;cursor:pointer} .crow .ti{color:var(--ink-2)} .crow .grow{flex:1 1 55%;min-width:0}
  .cdot{width:9px;height:9px;border-radius:99px;flex:0 0 auto;display:inline-block}
  .pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
  .pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
  .pill.plan{background:var(--plan-bg);color:var(--plan-ink)} .pill.none{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line-strong)}
  .pill.t{background:var(--surface-2);color:var(--ink-2)}

  /* ---- planner ---- */
  .pterm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow)}
  .pterm .ph{display:flex;align-items:center;gap:11px;padding:13px 15px;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .pterm .ph:hover{background:var(--surface-2)}
  .pterm .chev{width:11px;color:var(--ink-3);transition:transform .2s;flex:0 0 auto} .pterm.open .chev{transform:rotate(90deg)}
  .pterm .nm{font-weight:800;font-size:13.5px}
  .pterm .nowtag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
  .pterm .meta{margin-left:auto;font-weight:800;font-size:14px;color:var(--ink);flex:0 0 auto;text-align:right}
  .pterm .meta small{display:block;font-size:10px;color:var(--ink-3);font-weight:700}
  .pterm.now{border-color:color-mix(in srgb,var(--accent) 34%,var(--line-strong))}
  .pterm.past>.ph .nm{color:var(--ink-2)} .pterm.past{box-shadow:none;background:var(--surface)}
  .pterm.aux{background:transparent;border-style:dashed;box-shadow:none} .pterm.aux>.ph .nm{color:var(--ink-2)}
  .pterm.aux .meta.acount{font-size:12px;font-weight:800;color:var(--ink-3);background:var(--surface-2);border-radius:99px;min-width:22px;padding:2px 8px;text-align:center}
  .aux-div{display:flex;align-items:center;gap:11px;margin:22px 3px 11px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
  .aux-div::before,.aux-div::after{content:"";flex:1;height:1px;background:var(--line)}
  .pterm .body{border-top:1px solid var(--line);padding:6px 15px 12px;display:none} .pterm.open .body{display:block}
  .prow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .prow:last-child{border-bottom:0}
  .prow .co{font-weight:700;font-size:12.5px;white-space:nowrap;line-height:1.35} .prow .co.nonas{color:var(--accent)}
  .prow .ti{display:flex;flex-direction:column;gap:1px;min-width:0}
  .prow .ti .tn{color:var(--ink-2);font-size:11.5px;line-height:1.35}
  .prow .ti .prof{font-size:10px;color:var(--ink-3)} .prow .ti .prof.likely{font-style:italic}
  .prow .cc{font-weight:700;font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap;line-height:1.35}
  .prow .prow-right{display:flex;align-items:center;gap:9px;align-self:center}
  .prow.flagged{background:color-mix(in srgb,var(--accent) 5%,transparent)}
  .rflag{align-self:center;font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .prow-role{align-self:center;font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-3);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .wc-prof{font-size:11px;color:var(--ink-3);margin-top:6px} .wc-prof.likely{font-style:italic}

    /* Short blocks (≤55 min): shrink + tighten the code and time so the full code (wrapped) and the
       time both fit the reduced height without clipping, and drop the corner tag (no room for it). */
    .ev.short:not(.narrow) .c{font-size:9px;line-height:1}
    .ev.short:not(.narrow) .et{font-size:8.5px;line-height:1;margin-top:1px}
    /* Only full-width short blocks drop the tag (truly no room); a stacked (narrow) block keeps it. */
    .ev.short:not(.narrow) .ev-tags{display:none}
    .trow{grid-template-columns:auto 1fr 34px 38px;gap:9px} .trow .ds{display:none}
  }

  .gc-lsub b{color:var(--ink-2);font-weight:700}
  .gc-on{flex:0 0 auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ok-ink);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:99px;padding:3px 9px}
  .gc-soon{flex:0 0 auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border:1px solid var(--line-strong);border-radius:99px;padding:3px 9px}
  .gc-sw{flex:0 0 auto;width:42px;height:25px;border-radius:99px;background:var(--line-strong);border:0;padding:0;position:relative;cursor:pointer;transition:background .15s}
  .gc-sw.on{background:var(--accent)}
  .gc-sw:disabled{opacity:.6;pointer-events:none}
  .gc-knob{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .gc-sw.on .gc-knob{left:20px}

  /* ---- academic calendar ---- */
  #academic{max-width:760px}
  .acal-load{color:var(--ink-3);font-size:13px;font-weight:600;padding:30px 4px;text-align:center}

  #acal-refresh svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #acal-refresh.spin svg{animation:acal-spin .8s linear infinite}

  .acal-row{display:flex;gap:13px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin-bottom:7px}

<script>
const FN = "https://uhwdnmbxiopfysodydty.supabase.co/functions/v1/carnelian";
const FN_CANVAS = FN + "-canvas";   // isolated Canvas deadline-sync function
const GRADE_POINTS = {"A+":4.3,"A":4.0,"A-":3.7,"B+":3.3,"B":3.0,"B-":2.7,"C+":2.3,"C":2.0,"C-":1.7,"D+":1.3,"D":1.0,"D-":0.7,"F":0.0};
let TOKEN = localStorage.getItem("carn_token") || "";
let DB = {}, CUR = "schedule", TCAREER = localStorage.getItem("carn_tcareer") || "undergrad", BAKER_VIEW = "plan";
const EXP = new Set();            // expanded planner terms (in-memory; resets on app reload)
const REXP = new Set();           // expanded requirement rows (in-memory; all closed on app reload, kept across tab switches)
const $ = (s,r=document)=>r.querySelector(s);
const num = v => v==null||v===""? 0 : (typeof v==="number"?v:parseFloat(v));
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = n => Number.isInteger(n)?n:(Math.round(n*10)/10);
const crd = n => nf(n)+" credit"+(Number(n)===1?"":"s");   // spelled-out credit unit; never the casual "cr"
const ICO={
  share:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="m8 7.5 4-4 4 4"/><path d="M6 12.5v6a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-6"/></svg>',
  cal:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>',
  check:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6.5-11 11-5-5"/></svg>'
};

async function api(action, payload={}, base=FN){
  const r = await fetch(base,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,token:TOKEN,...payload})});
  const j = await r.json(); if(!r.ok) throw Object.assign(new Error(j.error||"error"),{status:r.status}); return j;
}
function relTime(iso){ if(!iso) return ""; const s=(Date.now()-new Date(iso).getTime())/1000; if(s<90) return "just now"; const m=Math.round(s/60); if(m<60) return m+"m ago"; const h=Math.round(m/60); if(h<24) return h+"h ago"; return Math.round(h/24)+"d ago"; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }

/* ---- ui helpers: scroll lock, modal open/close, custom dropdowns ---- */
let _scrollY=0;
function lockScroll(){ _scrollY=window.scrollY||0; document.body.style.position='fixed'; document.body.style.top=`-${_scrollY}px`; document.body.style.left='0'; document.body.style.right='0'; document.body.style.width='100%'; }
function unlockScroll(){ if(document.body.style.position!=='fixed') return; document.body.style.position=''; document.body.style.top=''; document.body.style.left=''; document.body.style.right=''; document.body.style.width=''; window.scrollTo(0,_scrollY); }
function openModal(el){ lockScroll(); el.classList.add('on'); }
function closeModal(el){ el.classList.remove('on'); unlockScroll(); }
function enhanceDD(sel){ if(!sel||sel._dd) return; const wrap=document.createElement('div'); wrap.className='dd';
  const btn=document.createElement('button'); btn.type='button'; btn.className='dd-btn';
  const menu=document.createElement('div'); menu.className='dd-menu'; wrap.appendChild(btn); wrap.appendChild(menu);
  sel.parentNode.insertBefore(wrap,sel); sel.style.display='none'; sel._dd={wrap,btn,menu};
  btn.onclick=(e)=>{ e.stopPropagation(); const isOpen=wrap.classList.contains('open'); document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open')); if(!isOpen)wrap.classList.add('open'); };
  syncDD(sel); }

/* ---- helpers ---- */
const today=()=>new Date().toISOString().slice(0,10);
const termById=id=>DB.terms.find(t=>t.id===id);
function currentTerm(){ const t=today(); return DB.terms.find(x=>x.starts_on&&x.ends_on&&x.starts_on<=t&&t<=x.ends_on); }
function displayStatus(e){
  if(e.status==="wishlist"||e.status==="transferred") return e.status;
  const term=termById(e.term_id), t=today();
  if(e.grade&&GRADE_POINTS[e.grade]!=null) return "completed";
  if(term&&term.ends_on&&term.ends_on<t) return "completed";
  if(term&&term.starts_on&&term.starts_on<=t&&(!term.ends_on||t<=term.ends_on)) return "in_progress";
  return e.status==="completed"?"completed":"planned";
}
// Colour by state: completed = green (ok), being taken now = blue (plan token), future = amber (warn token).
// "plan"/"warn" are the CSS class names; their token VALUES are --plan=blue and --warn=amber (see :root).
const STATUS_CLASS={completed:"ok",in_progress:"plan",planned:"warn",transferred:"t",wishlist:"none"};
const STATUS_LABEL={completed:"done",in_progress:"in progress",planned:"planned",transferred:"transferred",wishlist:"idea"};
// A course's role: plain coursework (default), a paid TA post (no credit/GPA/transcript), a
// for-credit teaching-experience course, or an audit (transcript grade V, no credit/GPA). Only
// plain courses fulfill degree requirements; paid TA work is excluded from every academic total.
const roleOf=e=>e.role||"course";
// timing of a whole term, derived from the calendar (past / current / upcoming)
function termTiming(term){ const t=today(); if(!term) return "planned";
  if(term.ends_on&&term.ends_on<t) return "completed";
  if(term.starts_on&&term.starts_on<=t&&(!term.ends_on||t<=term.ends_on)) return "in_progress";
  return "planned"; }
// default status for a new course being added to a given term
function statusForTerm(term_id){ return termTiming(termById(term_id)); }
const codeForMatch=e=>(e.analog_of||e.code||"");
const subjectOf=e=>codeForMatch(e).trim().split(/\s+/)[0]||"";
const levelOf=e=>{ const m=codeForMatch(e).match(/(\d{3,4})/); return m?parseInt(m[1]):0; };
const isX9xx=e=>{ const l=levelOf(e); return l && (l%1000)>=900; };
const childrenOf=pid=>DB.programs.filter(p=>p.parent_id===pid).sort((a,b)=>a.sort-b.sort);
const topPrograms=()=>DB.programs.filter(p=>!p.parent_id).sort((a,b)=>a.sort-b.sort);
const progById=id=>DB.programs.find(p=>p.id===id);

// ids of every graded course applied to the Baker program (incl. 6000-level courses taken as an undergrad)
function bakerAppliedIds(){ const s=new Set();
  for(const r of DB.requirements.filter(r=>r.program_id==="baker-mps")) for(const e of matchedFor(r)) s.add(String(e.id));
  return s; }
function gpa(career){ let q=0,c=0;
  const bset = career==="grad" ? bakerAppliedIds() : null;
  for(const e of DB.enrollments){ const p=GRADE_POINTS[e.grade]; if(p==null||!e.counts_gpa) continue;
    if(roleOf(e)==="ta_paid"||roleOf(e)==="audit") continue;   // never affect GPA
    const car=(termById(e.term_id)||{}).career||"undergrad";
    // grad GPA = grad-career courses PLUS any graded course applied to Baker (e.g. 6000-level taken as undergrad).
    // undergrad GPA = undergrad-career courses (the cross-applied ones stay here too — "Both").
    const inCareer = career==="grad" ? (car==="grad"||bset.has(String(e.id))) : (car==="undergrad");
    if(!inCareer) continue; q+=p*num(e.credits); c+=num(e.credits); }
  return c?{gpa:q/c,credits:c}:{gpa:null,credits:0}; }
function creditsScope(scope){ let c=0; for(const e of DB.enrollments){ const ds=displayStatus(e); if(!["completed","in_progress","transferred"].includes(ds)) continue;
  if(roleOf(e)==="ta_paid") continue;   // paid TA work isn't academic credit (audit is already 0 cr)
  const t=termById(e.term_id), car=t?t.career:"undergrad";
  if(scope==="as"){ if(!e.in_as||car==="grad") continue; } else if(scope==="grad"){ if(car!=="grad") continue; } else { if(car==="grad") continue; }
  c+=num(e.credits);} return Math.round(c*10)/10; }
// Baker credits toward the 62-credit MPS, computed once so the dashboard card and the
// transcript summary can never disagree. Counts every distinct course mapped to any Baker
// requirement (incl. 6000-level courses cross-applied from undergrad terms), split by whether
// it's actually earned yet. In-progress courses are "planned", not earned — so an in-progress
// semester never inflates the earned total.
function bakerCredits(){ const r1=n=>Math.round(n*10)/10;
  const m=new Map(); for(const r of DB.requirements.filter(r=>r.program_id==="baker-mps")) for(const e of matchedFor(r)) m.set(String(e.id),e);
  const vals=[...m.values()];
  const earned=r1(vals.filter(isEarned).reduce((s,e)=>s+num(e.credits),0));
  const planned=r1(vals.filter(e=>!isEarned(e)).reduce((s,e)=>s+num(e.credits),0));
  const need=DB.requirements.filter(r=>r.program_id==="baker-mps"&&!r.parent_id&&r.spec&&r.spec.need&&r.spec.need.type==="credits").reduce((s,r)=>s+r.spec.need.n,0);
  return { earned, planned, need, remaining:Math.max(0,r1(need-earned-planned)) }; }

/* ---- engine ---- */
function satisfiers(reqId){ const ids=new Set((DB.satisfactions||[]).filter(s=>s.requirement_id===reqId).map(s=>String(s.enrollment_id)));
  return DB.enrollments.filter(e=>ids.has(String(e.id))&&displayStatus(e)!=="wishlist"&&roleOf(e)==="course"); }
function autoMatch(req){ const spec=req.spec||{}, m=spec.match||{}; if(m.manual||m.scope||m.pool) return [];
  return DB.enrollments.filter(e=>{ if(displayStatus(e)==="wishlist") return false; if(roleOf(e)!=="course") return false;
    if(m.attribute) return (e.tags||[]).includes(m.attribute);
    if(m.subject){ if(subjectOf(e)!==m.subject) return false; const l=levelOf(e);
      if(m.levelMin&&l<m.levelMin) return false; if(m.levelMax&&l>m.levelMax) return false;
      if(spec.exclude&&spec.exclude.x9xx&&isX9xx(e)) return false; return true; }
    if(m.codes) return m.codes.includes(e.code); return false; }); }
const childReqIds=id=>DB.requirements.filter(r=>r.parent_id===id).map(r=>r.id);
function matchedFor(req){ const map=new Map(); for(const rid of [req.id,...childReqIds(req.id)]) for(const e of satisfiers(rid)) map.set(String(e.id),e); for(const e of autoMatch(req)) map.set(String(e.id),e); return [...map.values()]; }
// a course only counts as "done" toward a requirement when it's actually finished
const isEarned=e=>{ const ds=displayStatus(e); return ds==="completed"||ds==="transferred"; };
// Some requirements cap how many credits a repeatable course (e.g. the 0.5-cr weekly
// seminar, taken every term) may contribute — spec.caps maps course code -> max credits.
// Credits past the cap "overflow" to the requirement in spec.overflowTo (e.g. Free
// Electives) so they still show as electives; the degree total still counts each course
// once (via matchedFor), so nothing is lost or double-counted.
// A course's progress state toward a requirement: earned (done), being taken now (cur), or future (fut).
const progState=e=>{ const ds=displayStatus(e); return (ds==="completed"||ds==="transferred")?"done":(ds==="in_progress"?"cur":"fut"); };
function cappedCredits(req){
  const caps=(req.spec&&req.spec.caps)||null;
  // A requirement with an overflowTo target only ABSORBS up to its own `need`; credits beyond that
  // (e.g. a 3-cr course filling a 1.5-cr bucket) spill into the target (Free Electives). Baker buckets
  // are minimums, so nothing is wasted — the degree total still counts each course once (via matchedFor).
  const needN=(req.spec&&req.spec.need&&req.spec.need.type==="credits")?req.spec.need.n:null;
  const bucketOverflow=!!(req.spec&&req.spec.overflowTo)&&needN!=null;
  const courses=matchedFor(req);
  const r1=n=>Math.round(n*10)/10;
  let done=0,cur=0,fut=0, ovDone=0,ovCur=0,ovFut=0, bucketUsed=0;
  const kept=[],overflowed=[],splitOut=[]; const contrib=new Map(); const used={};
  // Fill order: earned first, then in-progress, then planned — so the realest work stays in the bucket and
  // only the least-committed credits spill out. Applying the per-course cap AND the bucket-level cap-at-need
  // in this single pass lets us record exactly how much of each course counted here (`contrib`, e.g. 1.5 of a
  // 3-cr course) and which single course partially spilled (`splitOut`), for the "1.5 of 3 cr" / "over … minimum" display.
  const rank={done:0,cur:1,fut:2};
  const ordered=courses.slice().sort((a,b)=>rank[progState(a)]-rank[progState(b)]);
  for(const e of ordered){ const c=num(e.credits), st=progState(e), cap=caps?caps[e.code]:null;
    let take=c, capOver=0;
    if(cap!=null){ const u=used[e.code]||0; take=Math.max(0,Math.min(c,cap-u)); capOver=r1(c-take); used[e.code]=u+take; }
    let bucketOver=0;
    if(bucketOverflow && take>0){ const room=Math.max(0,r1(needN-bucketUsed)); const fit=Math.min(take,room); bucketOver=r1(take-fit); take=fit; bucketUsed=r1(bucketUsed+fit); }
    if(take>0){ if(st==="done")done+=take; else if(st==="cur")cur+=take; else fut+=take; kept.push(e); contrib.set(String(e.id),r1(take)); }
    else if(capOver>0 && bucketOver===0) overflowed.push(e);   // whole course pushed out by its per-course cap
    const over=r1(capOver+bucketOver);
    if(over>0){ if(st==="done")ovDone+=over; else if(st==="cur")ovCur+=over; else ovFut+=over;
      if(bucketOver>0) splitOut.push({e, amount:bucketOver}); }   // a single course split across two buckets → show its source
  }
  return {done:r1(done),cur:r1(cur),fut:r1(fut),planned:r1(cur+fut),ovDone:r1(ovDone),ovCur:r1(ovCur),ovFut:r1(ovFut),kept,overflowed,splitOut,contrib};
}
// Credits pushed out of capped / over-filled requirements surface here for the overflow target. `splits`
// carries the single courses that were partially spilled (with the source requirement's name) so the
// target can show e.g. "REAL 5950 · 1.5 credits · over Construction… minimum" without duplicating the whole course.
function overflowInto(reqId){ let done=0,cur=0,fut=0,courses=[],splits=[]; const r1=n=>Math.round(n*10)/10;
  for(const r of DB.requirements){ if(r.spec&&r.spec.overflowTo===reqId){ const cc=cappedCredits(r); done+=cc.ovDone; cur+=cc.ovCur; fut+=cc.ovFut; courses=courses.concat(cc.overflowed);
    for(const s of cc.splitOut) splits.push({e:s.e, amount:s.amount, from:(r.spec&&r.spec.short)||r.name}); } }
  return {done:r1(done),cur:r1(cur),fut:r1(fut),courses,splits}; }
function reqProgress(req){
  const need=(req.spec&&req.spec.need)||{type:"courses",n:num(req.count_required||req.credits_required||1)};
  const r1=n=>Math.round(n*10)/10;
  if(need.type==="flag"){ const done=(DB.settings&&DB.settings.flags&&DB.settings.flags[req.id])?1:0; return {done,cur:0,fut:0,planned:0,need:1,met:done>=1,kind:"flag",courses:[]}; }
  if(need.type==="credits"){ const scope=req.spec&&req.spec.match&&req.spec.match.scope;
    let doneCr=0, curCr=0, futCr=0, courses=[], contrib=null, splits=[];
    if(scope){ for(const e of DB.enrollments){ const ds=displayStatus(e); if(ds==="wishlist") continue;
        const car=(termById(e.term_id)||{}).career||"undergrad";
        if(scope==="as"){ if(!e.in_as||car==="grad") continue; } else if(scope==="grad"){ if(car!=="grad") continue; } else { if(car==="grad") continue; }
        const st=progState(e), cr=num(e.credits); if(st==="done")doneCr+=cr; else if(st==="cur")curCr+=cr; else futCr+=cr; } }
    else { const cc=cappedCredits(req); doneCr=cc.done; curCr=cc.cur; futCr=cc.fut; courses=cc.kept; contrib=cc.contrib;
      const ov=overflowInto(req.id); doneCr=r1(doneCr+ov.done); curCr=r1(curCr+ov.cur); futCr=r1(futCr+ov.fut); courses=courses.concat(ov.courses); splits=ov.splits; }
    const kids=DB.requirements.filter(r=>r.parent_id===req.id).sort((a,b)=>a.sort-b.sort);
    const N=(BAKER_VIEW==="standard"&&req.program_id==="baker-mps"&&req.spec&&req.spec.standard!=null)?req.spec.standard:need.n;
    // Coupled requirement: a credit floor that's only meaningful alongside another (the 120-credit total
    // is real only with the ≥100-in-A&S floor). spec.alsoRequire lists requirement ids that must ALSO be
    // met. When this bucket's own credits already clear N but a gate isn't met, it's `gatedOnly` — not
    // complete, and the actionable shortfall lives in the gate requirement, not here (so we don't print
    // a negative "credits left").
    let met=doneCr>=N, gatedOnly=false, gateNote="";
    const gate=(req.spec&&req.spec.alsoRequire)||null;
    if(gate&&gate.length){ for(const gid of gate){ if(gid===req.id) continue; const g=DB.requirements.find(x=>x.id===gid); if(!g) continue;
        const gp=reqProgress(g); if(!gp.met){ met=false; if(doneCr>=N){ gatedOnly=true; const gl=(g.spec&&g.spec.short)||g.name; gateNote=`${nf(r1((gp.need||0)-gp.done))} more ${gl} needed`; } } } }
    return {done:r1(doneCr),cur:r1(curCr),fut:r1(futCr),planned:r1(curCr+futCr),need:N,met,gatedOnly,gateNote,kind:"credits",courses,kids,contrib,splits}; }
  if(need.type==="coverage"){ const kids=DB.requirements.filter(r=>r.parent_id===req.id).sort((a,b)=>a.sort-b.sort);
    let cov=0,covCur=0,covFut=0;
    for(const k of kids){ const ms=matchedFor(k); if(ms.some(isEarned)) cov++; else if(ms.some(e=>displayStatus(e)==="in_progress")) covCur++; else if(ms.length>0) covFut++; }
    return {done:cov,cur:covCur,fut:covFut,planned:covCur+covFut,need:need.n,met:cov>=need.n,kind:"coverage",kids}; }
  const kids=DB.requirements.filter(r=>r.parent_id===req.id).sort((a,b)=>a.sort-b.sort);
  const courses=matchedFor(req); const doneN=courses.filter(isEarned).length;
  const curN=courses.filter(e=>displayStatus(e)==="in_progress").length;
  return {done:doneN,cur:curN,fut:courses.length-doneN-curN,planned:courses.length-doneN,need:need.n,met:doneN>=need.n,kind:"courses",courses,kids};
}
// progress is CREDIT-WEIGHTED: a 27.5-cr Core moves the ring far more than a 1.5-cr bucket
const reqRatio=pr=>pr.need?Math.min(1,pr.done/pr.need):(pr.met?1:0);
const reqRatioP=pr=>pr.need?Math.min(1,(pr.done+(pr.planned||0))/pr.need):(pr.met?1:0);
const reqWeight=pr=>pr.kind==="flag"?1:(pr.need||1);
function weightedOver(rows){ let w=0,a=0,ap=0; for(const pr of rows){ const ww=reqWeight(pr); w+=ww; a+=ww*reqRatio(pr); ap+=ww*reqRatioP(pr); }
  const met=rows.length?rows.every(r=>r.met):true;
  let pct=w?Math.round(100*a/w):0, ppct=w?Math.round(100*ap/w):0;
  if(met) pct=100; else if(pct>=100) pct=99; if(ppct>=100&&!met) ppct=99;
  return {pct,ppct,met}; }
function programProgress(prog){
  const top=DB.requirements.filter(r=>r.program_id===prog.id&&!r.parent_id).sort((a,b)=>a.sort-b.sort);
  const rows=top.map(r=>({req:r,...reqProgress(r)}));
  const w=weightedOver(rows);
  return {prog,rows,pct:w.pct,ppct:w.ppct,met:w.met};
}
function degreeProgress(prog){
  const self=programProgress(prog);
  const kids=childrenOf(prog.id).map(c=>({prog:c,...programProgress(c)}));
  let all=[...self.rows]; for(const k of kids) all=all.concat(k.rows);
  const w=weightedOver(all);
  return {prog,self,kids,pct:w.pct,ppct:w.ppct,met:self.met&&kids.every(k=>k.met)};
}
function outstanding(){ // every unmet leaf requirement across all programs
  const out=[];
  for(const p of DB.programs){
    const tops=DB.requirements.filter(r=>r.program_id===p.id&&!r.parent_id).sort((a,b)=>a.sort-b.sort);
    for(const r of tops){ const pr=reqProgress(r); if(pr.met) continue;
      if(pr.gatedOnly) continue; // coupled gate (e.g. A&S credits) carries the actionable shortfall — don't double-list
      let amt="", detail="";
      if(pr.kind==="credits"){ amt=crd(pr.need-pr.done); }
      else if(pr.kind==="coverage"){ amt=(pr.need-pr.done)+" left"; detail=(pr.kids||[]).filter(k=>matchedFor(k).length===0).map(k=>k.name).join(", "); }
      else if(pr.kind==="flag"){ amt="to do"; }
      else { amt=(pr.need-pr.done)+" course"+((pr.need-pr.done)===1?"":"s"); detail=(pr.kids||[]).filter(k=>matchedFor(k).length===0).map(k=>k.name).join(", "); }
      out.push({prog:p, req:r, amt, detail});
    }
  }
  return out;
}
function ring(pct,size,met,ppct){ const col=met?"var(--ok)":"var(--accent)";
  const planned=(ppct!=null&&ppct>pct)?`<circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--warn)" opacity=".35" stroke-width="4" stroke-linecap="round" stroke-dasharray="${ppct*0.973} 100" transform="rotate(-90 18 18)"/>`:"";
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--surface-3)" stroke-width="4"/>${planned}<circle cx="18" cy="18" r="15.5" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${pct*0.973} 100" transform="rotate(-90 18 18)"/></svg>`; }
const barFill=(pct,met)=>`<i class="fill ${met?'ok':'warn'}" style="width:${Math.max(pct,3)}%"></i>`;
// two-tone: solid earned + lighter planned
function bar2(donePct,plannedPct,met){ const d=Math.max(0,Math.min(100,donePct)); const p=Math.max(0,Math.min(100,plannedPct||0)-d);
  return `<i class="fill ${met?'ok':'warn'}" style="width:${d}%"></i>`+(p>0.5?`<i class="fill planned" style="width:${p}%"></i>`:""); }
const pctPlan=pr=>pr.need?Math.round(100*Math.min(1,(pr.done+(pr.planned||0))/pr.need)):(pr.met?100:0);
// three-tone requirement bar: earned (green) → in-progress (blue) → planned (amber), rest = empty track.
// Segments stack and are clamped so the total never exceeds the bar; unfilled width = credits not yet planned.
function bar3(pr){ const need=pr.need||0; const seg=v=> need?Math.max(0,Math.min(100,100*v/need)):(v>0?100:0);
  let d=seg(pr.done), c=seg(pr.cur||0), f=seg(pr.fut||0);
  d=Math.min(100,d); c=Math.min(100-d,c); f=Math.min(100-d-c,f);
  const px=(cls,w)=> w>0.5?`<i class="fill ${cls}" style="width:${w}%"></i>`:"";
  return px('ok',d)+px('plan',c)+px('warn',f); }

    `<div class="gpa"><div class="k">Baker GPA</div><div class="v">${gr.gpa?gr.gpa.toFixed(2):"—"}</div></div>`;

function goToReqs(progId){ REQ_FOCUS=progId; showPage("requirements"); const el=document.getElementById("pg-"+progId); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
let REQ_FOCUS=null;

function renderDashboard(){
  const ug=gpa("undergrad"), gr=gpa("grad"), cur=currentTerm();

  const asReq=DB.requirements.find(r=>r.id==="as-ascred"); const asNeed=asReq?asReq.spec.need.n:100;
  const ugTotReq=DB.requirements.find(r=>r.id==="as-total"); const ugNeed=ugTotReq?ugTotReq.spec.need.n:120;
  // Baker: sum the program's credit buckets for the target, and the distinct courses mapped to any Baker bucket for progress
  const bc=bakerCredits(), bakerNeed=bc.need, bakerEarned=bc.earned, bakerPlan=bc.planned, bakerFind=bc.remaining;
  const asShort=asC<asNeed;
  const gradTerms=DB.terms.filter(t=>t.career==="grad").sort((a,b)=>a.sort-b.sort); const firstGrad=gradTerms[0];
  const bakerNote=gr.gpa?nf(gr.credits)+" graded credits":(firstGrad?(termTiming(firstGrad)==="planned"?"Starts "+esc(firstGrad.name.replace(/ · Baker$/,"")):"In progress"):"Not started");
  // GPAs used to sit in their own two boxes here; they now live large inside each degree card

  const stat=`<div class="statgrid">
    <div class="stat"><div class="k">Undergrad Credits</div><div class="v">${nf(allC)}<small> / ${nf(ugNeed)}</small></div><div class="sub ${asShort?'warnsub':''}">${nf(asC)} / ${nf(asNeed)} in A&amp;S${asShort?'':' ✓'}</div></div>
    <div class="stat"><div class="k">Baker Credits</div><div class="v">${nf(bakerEarned)}<small> / ${nf(bakerNeed)}</small></div><div class="sub">${bakerEarned>=bakerNeed?'All requirements earned ✓':`${nf(bakerPlan)} planned · ${nf(bakerFind)} remaining`}</div></div>
  </div>`;

  const degrees=topPrograms().map(p=>{
    const dp=degreeProgress(p); let rows="";
    // each degree carries its own GPA: the A&S umbrella shows the undergrad GPA, Baker the grad GPA
    const gcar=(p.id==="baker-mps")?"grad":"undergrad"; const dg=(gcar==="grad")?gr:ug;
    const dgStr=dg.gpa?dg.gpa.toFixed(2):"—";
    if(dp.kids.length){
      rows+=drow("College requirements", dp.self.pct, dp.self.met, leftLabel(dp.self), ()=>goToReqs(p.id), p.id, dp.self.ppct);
      for(const k of dp.kids) rows+=drow(k.prog.name, k.pct, k.met, leftLabel(k), null, k.prog.id, k.ppct);
    } else {
      for(const r of dp.self.rows) rows+=drow(r.req.name, r.need?Math.min(100,Math.round(100*r.done/r.need)):0, r.met, reqLeft(r), null, p.id, pctPlan(r));
    }
    return `<div class="degree">
      <div class="dh"><div class="ring">${ring(dp.pct,52,dp.met,dp.ppct)}<b>${dp.pct}%</b></div>
        <div class="dt"><div class="nm">${esc(p.name)}</div><div class="mt">${dp.met?'Complete':dp.pct+'% complete'}</div></div>
        <button class="dgpa" data-tc-open="${gcar}" aria-label="GPA, open transcript"><span class="k">GPA</span><span class="v">${dgStr}</span></button></div>
      <div class="rows" data-prog="${p.id}">${rows}</div></div>`;
  }).join("");

  const out=outstanding();
  let left;
  if(!out.length) left=`<div class="todo"><div class="done-note">✓ Everything on record is complete.</div></div>`;
  else left=`<div class="todo">${out.map(o=>`<button class="titem" data-goto="${o.prog.id}">
      <span class="grow"><div class="nm">${esc(o.req.name)}</div><div class="sub">${esc(progById(o.prog.id).name)}${o.detail?' · '+esc(o.detail):''}</div></span>
      <span class="amt">${esc(o.amt)}</span></button>`).join("")}</div>`;

  $("#dashboard").innerHTML=`<div class="phead"><h1>Overview</h1></div>${stat}
    <div class="sect-h">Degrees</div>${degrees}
    <div class="sect-h">What's left</div>${left}`;
  $("#dashboard").querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>goToReqs(b.dataset.goto));
  $("#dashboard").querySelectorAll(".drow[data-goto]").forEach(b=>b.onclick=()=>goToReqs(b.dataset.goto));
  // The GPA cards open the transcript (now folded in) on the matching career tab.
  $("#dashboard").querySelectorAll("[data-tc-open]").forEach(b=>{ const go=()=>{ TCAREER=b.dataset.tcOpen; localStorage.setItem("carn_tcareer",TCAREER); renderTranscript(); showPage("transcript"); };
    b.onclick=go; b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }; });
}
function leftLabel(pp){ if(pp.met) return "complete"; const n=pp.rows.filter(r=>!r.met).length; return n+" item"+(n===1?"":"s")+" left"; }
function reqLeft(r){ if(r.met) return "complete"; const plan=r.planned||0;
  if(r.kind==="credits") return crd(r.need-r.done)+" left"+(plan>0?` · ${nf(plan)} planned`:"");
  if(r.kind==="flag") return "to do"; return (r.need-r.done)+" left"+(plan>0?` · ${plan} planned`:""); }
function drow(name,pct,met,sub,onclick,goto,ppct){
  const cls=met?"ok":((pct>0||(ppct||0)>0)?"warn":"none");
  return `<button class="drow" ${goto?`data-goto="${goto}"`:""}><span class="dot ${cls}"></span>
    <span class="grow"><div class="nm">${esc(name)}</div><div class="sub">${esc(sub)}</div></span>
    <span class="mini">${bar2(pct,ppct!=null?ppct:pct,met)}</span><span class="rt ${met?'c-ok':'c-ink3'}">${met?'✓':pct+'%'}</span></button>`;
}

function courseChip(e){ const ds=displayStatus(e); return `<span class="pill ${STATUS_CLASS[ds]}"><span class="code">${esc(e.code)}</span></span>`; }
function renderRequirements(){
  let html=`<div class="phead"><h1>Requirements</h1></div>`;
  for(const top of topPrograms()){
    html+=`<div class="pgroup" id="pg-${top.id}">`;
    const dp=degreeProgress(top);
    html+=`<div class="gh"><span class="nm">${esc(top.name)}</span><span class="rt ${dp.met?'c-ok':'c-warn'}">${dp.met?'complete':dp.pct+'%'}</span></div>`;
    if(top.id==="baker-mps"){
      html+=`<div class="segrow"><div class="seg" id="bakerSeg"><button data-bv="plan" class="${BAKER_VIEW==='plan'?'on':''}">My plan</button><button data-bv="standard" class="${BAKER_VIEW==='standard'?'on':''}">Standard curriculum</button></div>
        <p class="segnote">${BAKER_VIEW==='plan'?'Your plan: HADM 4200 + HADM 4870 (taken as an undergrad) waive the matching core courses, shifting 6 credits from Core into Free Electives.':'Cornell\'s published MPS-RE curriculum — 62 credits, before any waivers.'}</p></div>`;
    }
    html+=reqBlocks(top);
    for(const k of childrenOf(top.id)){
      const kp=programProgress(k);
      html+=`<div class="subhead" id="pg-${k.id}"><span class="dot ${kp.met?'ok':'warn'}" style="background:${kp.met?'var(--ok)':'var(--warn)'}"></span>${esc(k.name)} — ${kp.met?'complete':kp.pct+'%'}</div><div class="indent">${reqBlocks(k)}</div>`;
    }
    html+=`</div>`;
  }
  $("#requirements").innerHTML=html;
  $("#requirements").querySelectorAll("[data-rt]").forEach(b=>{ const tog=(ev)=>{ev.stopPropagation();const id=b.dataset.rt;const req=b.closest(".req");req.classList.toggle("open");if(req.classList.contains("open"))REXP.add(id);else REXP.delete(id);}; b.onclick=tog; b.onkeydown=(ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); tog(ev); } }; });
  $("#requirements").querySelectorAll("#bakerSeg button").forEach(b=>b.onclick=()=>{BAKER_VIEW=b.dataset.bv;renderRequirements();});
  $("#requirements").querySelectorAll("[data-editreq]").forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();openReq(b.dataset.editreq);});
  $("#requirements").querySelectorAll(".co[data-cid]").forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();openCourse(b.dataset.cid);});
}
// Render a requirement's course list grouped by term (chronological) and sorted by
// course code within each term. Used when a requirement's spec sets groupByTerm.
// `counted` (optional) = credits this course actually contributes to THIS requirement; when it's less
// than the course's full credits (a big course over-filling a small bucket), show "1.5 of 3 credits".
function courseRowHTML(e, counted){ const full=num(e.credits);
  const cr=(counted!=null&&counted<full)?`${nf(counted)} <span class="muted">of ${nf(full)}</span> credits`:crd(full);
  return `<div class="crow"><span class="cdot dot ${STATUS_CLASS[displayStatus(e)]}"></span><span class="grow"><span class="co code" data-cid="${e.id}">${esc(e.code)}</span> <span class="ti">${esc(e.title||'')}</span></span><span class="cc num">${cr}</span></div>`; }
// A single course's overflow into this bucket (e.g. the 1.5 cr of REAL 5950 beyond the 1.5-cr CST minimum).
function splitRowHTML(s){ return `<div class="crow"><span class="cdot dot ${STATUS_CLASS[displayStatus(s.e)]}"></span><span class="grow"><span class="co code" data-cid="${s.e.id}">${esc(s.e.code)}</span> <span class="ti muted">over ${esc(s.from)} minimum</span></span><span class="cc num">${crd(s.amount)}</span></div>`; }
function coursesByTermHTML(courses){
  const groups=new Map();
  for(const e of courses){ const k=e.term_id||'~none'; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e); }
  const order=[...groups.keys()].map(id=>termById(id)||{id,name:'No term',sort:1e9}).sort((a,b)=>(a.sort??1e9)-(b.sort??1e9));
  return order.map(t=>{
    const list=groups.get(t.id).slice().sort((a,b)=>String(a.code||'').localeCompare(String(b.code||''),undefined,{numeric:true}));
    return `<div class="crow termhdr"><span class="grow">${esc(t.name||t.id)}</span></div>`+list.map(courseRowHTML).join("");
  }).join("");
}
function reqBlocks(prog){
  const tops=DB.requirements.filter(r=>r.program_id===prog.id&&!r.parent_id).sort((a,b)=>a.sort-b.sort);
  return tops.map((req,i)=>{
    const r={req,...reqProgress(req)};
    let inner="";
    if(r.kind==="coverage"||(r.kids&&r.kids.length&&r.kind!=="credits")){
      inner=r.kids.map(k=>{const kc=matchedFor(k);const met=kc.some(isEarned);const cur=!met&&kc.some(e=>displayStatus(e)==="in_progress");
        return `<div class="crow"><span class="cdot dot ${met?'ok':(cur?'plan':(kc.length?'warn':'none'))}"></span><span class="grow">${esc(k.name)}</span>${kc.map(courseChip).join(" ")||'<span class="pill none">open</span>'}</div>`;}).join("");
      // no "N more needed" row here — the open categories above + the done/need count in the header already say it
    } else if(r.kind==="flag"){
      inner=`<div class="crow"><span class="cdot dot ${r.met?'ok':'none'}"></span><span class="grow">${r.met?'Recorded as done':'Not recorded yet'}</span></div>`;
    } else if(r.kind==="credits"){
      const pp=[]; if((r.cur||0)>0) pp.push(`${nf(r.cur)} in progress`); if((r.fut||0)>0) pp.push(`${nf(r.fut)} planned`);
      const planStr=pp.length?` <span class="muted">(+${pp.join(", ")})</span>`:"";
      const bar=`<div class="crow" style="border:0"><span class="grow"><b>${nf(r.done)}</b> of <b>${nf(r.need)}</b> credits${planStr}</span><span class="mini" style="width:90px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex">${bar3(r)}</span></div>`;
      const note=(BAKER_VIEW==='plan'&&req.spec&&req.spec.note)?`<div class="crow waivernote"><span class="grow">${esc(req.spec.note)}</span></div>`:"";
      let detail=note;
      if(req.spec&&req.spec.groupByTerm && r.courses&&r.courses.length){ detail=coursesByTermHTML(r.courses); }
      else if(r.kids&&r.kids.length){ detail=r.kids.map(k=>{const kc=matchedFor(k);const km=kc.some(isEarned);const kcur=!km&&kc.some(e=>displayStatus(e)==="in_progress");return `<div class="crow"><span class="cdot dot ${km?'ok':(kcur?'plan':(kc.length?'warn':'none'))}"></span><span class="grow">${esc(k.name)}</span>${kc.map(courseChip).join(" ")||'<span class="pill none">open</span>'}</div>`;}).join(""); }
      else if(r.courses&&r.courses.length){ detail=r.courses.map(e=>courseRowHTML(e, r.contrib&&r.contrib.get(String(e.id)))).join(""); }
      if(r.splits&&r.splits.length) detail+=r.splits.map(splitRowHTML).join("");   // partial overflows spilled in from other buckets
      // Coupled-floor gate: own credits clear the bar but a partner floor (e.g. ≥100 in A&S) isn't met yet.
      const gnote=r.gatedOnly?`<div class="crow"><span class="cdot dot warn"></span><span class="grow muted">${esc(r.gateNote)}</span></div>`:"";
      inner=bar+gnote+detail;
    } else {
      const list=r.courses.map(e=>`<div class="crow"><span class="cdot dot ${STATUS_CLASS[displayStatus(e)]}"></span><span class="grow"><span class="co code" data-cid="${e.id}">${esc(e.code)}</span> <span class="ti">${esc(e.title||'')}</span></span><span class="pill ${STATUS_CLASS[displayStatus(e)]}">${STATUS_LABEL[displayStatus(e)]}</span></div>`).join("");
      inner=list+(r.done<r.need?`<div class="crow"><span class="cdot dot none"></span><span class="grow muted">${nf(r.need-r.done)} more needed</span></div>`:"");
    }
    const pct=r.need?Math.min(100,100*r.done/r.need):(r.met?100:0);
    const openByDefault=REXP.has(r.req.id);
    return `<div class="req ${openByDefault?'open':''} ${r.met?'met':''}"><div class="bh" data-rt="${r.req.id}" role="button" tabindex="0" aria-label="Toggle ${esc(r.req.name)}">
      <span class="chev">›</span>
      <span class="cdot dot ${r.met?'ok':(r.cur>0?'plan':((r.done>0||r.fut>0)?'warn':'none'))}"></span>
      <span class="nm">${esc(r.req.name)}</span>
      <span class="mini">${bar3(r)}</span>
      <span class="cr ${r.met?'c-ok':''}">${r.kind==='flag'?(r.met?'✓':'—'):nf(r.done)+'/'+nf(r.need)}</span>
      <button class="edit" data-editreq="${r.req.id}">edit</button></div>
      <div class="body">${inner}</div></div>`;
  }).join("")||'<p class="muted" style="margin:2px 2px 12px">No requirements yet.</p>';
}

const byCode=(a,b)=>String(codeLabel(a)).localeCompare(String(codeLabel(b)),undefined,{numeric:true});
// what to show as a course's "code" — Oxford/transferred courses have no Cornell code, so label them "Oxford"
const codeLabel=e=>{ const c=(e.code||'').trim(); return (c&&c!=='OXON')?c:'Oxford'; };
const prowHTML=e=>{ const p=profInfo(e); const fl=RCHECK_FLAG.has(String(e.id)); const r=roleOf(e);
  const sub=p.name?`<span class="prof${p.likely?' likely':''}">${esc(p.name)}</span>`:'';
  const rt=r==='audit'?'Audit':(r==='ta_paid'||r==='ta_credit')?'TA':'';   // 0-credit roles show a tag instead of "0"
  const showCr=!(r==='ta_paid'||r==='audit');
  return `<div class="prow${fl?' flagged':''}" data-cid="${e.id}"><span class="co code ${e.in_as?'':'nonas'}">${esc(codeLabel(e))}</span><span class="ti"><span class="tn">${esc(e.title||'')}</span>${sub}</span><span class="prow-right">${rt?`<span class="prow-role">${rt}</span>`:''}${fl?'<span class="rflag">update</span>':''}${showCr?`<span class="cc num">${nf(num(e.credits))}</span>`:''}</span></div>`; };
const TSTAT={completed:{c:"done",l:"completed"},in_progress:{c:"now",l:"in progress"},planned:{c:"soon",l:"upcoming"}};
function fmtDiff(d){ if(d.field==="credits") return nf(d.from)+"→"+nf(d.to); return "→ “"+String(d.to).slice(0,44)+"”"; }
// The "Roster check" results panel shown atop the planner after a check finds something actionable.
function rcheckPanelHTML(){
  if(!RCHECK.ran || !RCHECK.items.length) return "";
  const rows=RCHECK.items.map(({e,st})=>{
    const term=termById(e.term_id), tn=term?term.name:"";
    let note="", act="";
    if(st.state==="available"){
      note=st.single?"roster now live — meeting times available":"roster now live — sections available";
      if(st.diffs&&st.diffs.length) note+=" · "+st.diffs.map(d=>d.field+" "+fmtDiff(d)).join(", ");
      act=st.single?`<button class="rc-act" data-rc-update="${e.id}">Update</button>`:`<button class="rc-act" data-rc-pick="${e.id}">Pick sections</button>`;
    } else if(st.state==="notoffered"){
      note="not in the published "+esc(st.ideal)+" roster — may not be offered";
      act=`<button class="rc-act ghost" data-rc-open="${e.id}">Open</button>`;
    }
    return `<div class="rc-item"><div class="rc-info"><div class="rc-line"><span class="rc-code">${esc(codeLabel(e))}</span><span class="rc-term">${esc(tn)}</span></div><div class="rc-note">${note}</div></div>
      <div class="rc-actions">${act}<button class="rc-act ghost" data-rc-dismiss="${e.id}">Dismiss</button></div></div>`;
  }).join("");
  return `<div class="rc-panel"><div class="rc-head"><span class="rc-title">Roster check</span><button class="rc-close" data-rc-clear="1">Clear</button></div>${rows}</div>`;
}
function renderPlanner(){
  const terms=[...DB.terms].sort((a,b)=>a.sort-b.sort);
  const t=today();
  let cum={undergrad:0,grad:0};
  const cards=terms.map(term=>{
    const es=DB.enrollments.filter(e=>e.term_id===term.id).sort(byCode);
    const cr=es.reduce((s,e)=>s+num(e.credits),0);
    const car=term.career||"undergrad"; cum[car]+=cr;
    const timing=termTiming(term); const isNow=timing==="in_progress", past=timing==="completed";
    // default: current term + any term that has courses stay open; empty past/future terms collapse
    const isOpen=EXP.has(term.id)?true:(isNow||(!past&&es.length>0));
    const rows=es.map(prowHTML).join("");
    return `<div class="pterm ${isOpen?'open':''}${isNow?' now':''}${past?' past':''}" data-term="${term.id}">
      <div class="ph" data-toggle="${term.id}"><span class="chev">›</span><span class="nm">${esc(term.name)}</span>${isNow?'<span class="nowtag">now</span>':''}
        <span class="meta">${nf(cr)}<small> credit${cr===1?'':'s'} · ${nf(cum[car])} total</small></span></div>
      <div class="body">${rows||'<p class="muted" style="padding:6px 0">Nothing here yet.</p>'}
        <div class="add-in" data-add="${term.id}">＋ add a course</div></div></div>`;
  }).join("");
  const unsched=DB.enrollments.filter(e=>!e.term_id&&e.status!=="wishlist").sort(byCode);
  let unschedCard="";
  if(unsched.length){
    const ur=unsched.map(prowHTML).join("");
    unschedCard=`<div class="pterm aux open"><div class="ph" data-toggle="__unsched"><span class="chev">›</span><span class="nm">Unscheduled</span><span class="meta acount">${unsched.length}</span></div>
      <div class="body"><p class="hint" style="padding:0 0 8px">Saved without a term — open one to give it a term.</p>${ur}</div></div>`;
  }
  const wish=DB.enrollments.filter(e=>e.status==="wishlist").sort(byCode);
  const wcards=wish.map(e=>{
    const meets=meetInfoHTML(meetingsOf(e)); const p=profInfo(e); const showProf=p.name&&!savedInstructor(e);
    const prof=showProf?`<div class="wc-prof${p.likely?' likely':''}">${esc(p.name)}</div>`:'';
    return `<div class="wcard${RCHECK_FLAG.has(String(e.id))?' flagged':''}" data-cid="${e.id}"><div class="co code">${esc(codeLabel(e))}</div><div class="ti">${esc(e.title||'')}</div>
    <div class="meta">${(e.tags||[]).map(t=>`<span class="pill t">${esc(t)}</span>`).join("")}<span class="muted num">${crd(num(e.credits))}</span></div>
    ${prof}${meets?`<div class="ci-meets wc-meets">${meets}</div>`:''}</div>`;
  }).join("");
  const wishCard=`<div class="pterm aux open"><div class="ph" data-toggle="__wish"><span class="chev">›</span><span class="nm">Wishlist</span><span class="meta acount">${wish.length}</span></div>
    <div class="body">${wcards?`<div class="wgrid">${wcards}</div>`:'<p class="hint" style="padding:0 0 8px">Courses you might take — separate from your plan.</p>'}
      <div class="add-in" data-addwish="1">＋ add a wishlist idea</div></div></div>`;
  const auxDiv=(unschedCard||wishCard)?`<div class="aux-div">holding area</div>`:"";
  const cvStat = CANVAS.configured
    ? `Canvas · ${CANVAS.last_sync_at ? 'synced '+relTime(CANVAS.last_sync_at) : 'not synced yet'}${CANVAS.pending ? ' · '+CANVAS.pending+' to review' : ''}`
    : (CANVAS.loaded ? 'Canvas deadlines not connected' : '');
  const head=`<div class="phead"><h1>Planner</h1><div class="actions"><button id="plannerSyncBtn" class="rcheck-btn" type="button" title="Pull Canvas deadlines and check Cornell rosters">↻ Sync</button></div></div>${cvStat?`<div class="canvas-stat">${esc(cvStat)}</div>`:''}`;
  $("#planner").innerHTML=`${head}${rcheckPanelHTML()}${cards}${auxDiv}${unschedCard}${wishCard}`;
  if(!CANVAS.loaded && !renderPlanner._cv){ renderPlanner._cv=true; canvasRefresh().then(()=>{ if(CUR==='planner') renderPlanner(); }); }
  { const psb=$("#plannerSyncBtn"); if(psb) psb.onclick=plannerSync; }
  $("#planner").querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const id=b.dataset.toggle;const c=b.closest(".pterm");c.classList.toggle("open");if(c.classList.contains("open"))EXP.add(id);else EXP.delete(id);});
  // A saved course opens its assignments sheet (with a quiet Edit-course button); wishlist ideas open the edit modal.
  $("#planner").querySelectorAll(".prow[data-cid]").forEach(b=>b.onclick=()=>openCourseAssignments(b.dataset.cid));
  $("#planner").querySelectorAll(".wcard[data-cid]").forEach(b=>b.onclick=()=>openCourse(b.dataset.cid));
  $("#planner").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openCourse(null,{term_id:b.dataset.add,status:statusForTerm(b.dataset.add)}));
  $("#planner").querySelectorAll("[data-addwish]").forEach(b=>b.onclick=()=>openCourse(null,{status:"wishlist"}));
  wireRcheckActions();
  // fill in likely professors for planned/wishlist courses, then re-render once if any were learned
  if(!renderPlanner._hy){ renderPlanner._hy=true;
    hydrateProfessors(DB.enrollments.filter(e=>{const d=displayStatus(e);return d==="planned"||d==="in_progress"||d==="wishlist";}))

function renderSchedule(){
  // once the published-roster list loads, re-render so newly-eligible future terms appear
  if(!AVAIL_ROSTERS && !renderSchedule._av){ renderSchedule._av=true; availRosters().then(()=>renderSchedule()); }
  const withData=schedTermsWithData();
  const cur=currentTerm();
  const termList=(withData.length?withData:DB.terms).slice().sort((a,b)=>a.sort-b.sort);
  if(!SCHED_TERM || !termList.find(t=>t.id===SCHED_TERM)){
    SCHED_TERM=(cur&&termList.find(t=>t.id===cur.id))?cur.id:(termList[0]||{}).id;
  }
  const term=termById(SCHED_TERM);
  // reset the visible week whenever the term changes, then default to the current/opening week
  if(renderSchedule._lastTerm!==SCHED_TERM){ renderSchedule._lastTerm=SCHED_TERM; SCHED_WEEK=null; }
  const ac=termAcademics(term);
  // one-time academic-calendar fetch so the overlay + no-class suppression can populate
  if(!academicEvents() && !renderSchedule._acal){ renderSchedule._acal=true; try{ loadAcademic(false).then(()=>renderSchedule()); }catch(e){} }
  if(!SCHED_WEEK) SCHED_WEEK=defaultWeekMon(term);
  const firstMon=mondayOf(ac.ts||new Date()), lastMon=mondayOf(ac.te||SCHED_WEEK);
  if(SCHED_WEEK<firstMon) SCHED_WEEK=new Date(firstMon.getTime());
  if(SCHED_WEEK>lastMon) SCHED_WEEK=new Date(lastMon.getTime());
  const weekMon=SCHED_WEEK, todayD=new Date();
  const dateOf=d=>{ const i=SDAYS.indexOf(d); return new Date(weekMon.getFullYear(),weekMon.getMonth(),weekMon.getDate()+i); };
  const es=DB.enrollments.filter(e=>e.term_id===SCHED_TERM&&displayStatus(e)!=="wishlist");
  // assign a distinct palette color to each course in this term (no repeats until >10 courses)
  SCHED_CIDX=assignCourseColors(es);
  const cidxOf=e=>{ const k=e.code||('#'+e.id); return SCHED_CIDX[k]!=null?SCHED_CIDX[k]:courseColorIdx(e.code); };
  // today's column shows only when the visible week is the real current week and today is in-term
  const inTermNow=ac.ts&&ac.te&&todayD>=ac.ts&&todayD<=ac.te;
  const showToday=(inTermNow&&sameDay(mondayOf(todayD),weekMon))?todayDayCode():null;
  const credits=es.reduce((s,e)=>s+num(e.credits),0);
  const termHasTimed=es.some(e=>meetingsOf(e).some(m=>m.days&&m.days.length&&hm2min(m.start)!=null&&hm2min(m.end)!=null&&hm2min(m.end)>hm2min(m.start)));
  const events=[], unsched=[];
  for(const e of es){
    const mtgs=meetingsOf(e).filter(m=>m.days&&m.days.some(d=>SDAYS.includes(d))&&hm2min(m.start)!=null&&hm2min(m.end)!=null&&hm2min(m.end)>hm2min(m.start));
    if(!mtgs.length){ unsched.push(e); continue; }
    const ci=cidxOf(e);
    for(const m of mtgs){ const part=partOf(m);
      for(const d of m.days){ if(!SDAYS.includes(d)) continue; const D=dateOf(d);
        if(isNoClassDay(D,ac)||!meetingActiveOn(part,D,ac)) continue;   // break day, or the meeting's half isn't in session this week
        events.push({e,ci,day:d,s:hm2min(m.start),en:hm2min(m.end),m,part}); } }
  }
  // assignments/deadlines for this week: timed (exam/quiz) → grid blocks, else → all-day chips
  const isoOf=D=>`${D.getFullYear()}-${String(D.getMonth()+1).padStart(2,"0")}-${String(D.getDate()).padStart(2,"0")}`;
  const asgWk=(typeof asgWeek==='function')?asgWeek(weekMon):{chips:[],blocks:[]};
  const asgBlocksByDay={}, asgChipsByDay={}; SDAYS.forEach(d=>{asgBlocksByDay[d]=[];asgChipsByDay[d]=[];});
  for(const r of asgWk.blocks){ const iso=r.iso||asgDate(r.a); const di=SDAYS.findIndex(d=>isoOf(dateOf(d))===iso); if(di<0) continue;
    const s=hm2min(String(r.a.due_time).slice(0,5)); if(s==null) continue; const en=s+Math.max(num(r.a.duration_min)||30,20);
    asgBlocksByDay[SDAYS[di]].push({...r,s,en}); }
  for(const r of asgWk.chips){ const iso=r.iso||asgDate(r.a); const di=SDAYS.findIndex(d=>isoOf(dateOf(d))===iso); if(di>=0) asgChipsByDay[SDAYS[di]].push(r); }
  let minS=Infinity,maxE=-Infinity;
  for(const ev of events){minS=Math.min(minS,ev.s);maxE=Math.max(maxE,ev.en);}
  for(const d of SDAYS) for(const b of asgBlocksByDay[d]){minS=Math.min(minS,b.s);maxE=Math.max(maxE,b.en);}
  if(!isFinite(minS)){minS=8*60;maxE=18*60;}
  const anyAsgBlock=SDAYS.some(d=>asgBlocksByDay[d].length);
  const startH=Math.floor(minS/60), endH=Math.ceil(maxE/60);
  const gStart=startH*60, gEnd=endH*60, total=gEnd-gStart, rows=endH-startH;
  // live "now" line: only when today's weekday column is on this grid (current term shown)
  SCHED_NOW = (showToday && events.length) ? {gStart, gEnd, total, col: SDAYS.indexOf(showToday)} : null;
  const byDay={}; SDAYS.forEach(d=>byDay[d]=[]);
  events.forEach(ev=>byDay[ev.day].push(ev));
  let conflictAny=false;
  for(const d of SDAYS){
    const list=byDay[d].sort((a,b)=>a.s-b.s||a.en-b.en);
    let i=0;
    while(i<list.length){
      let j=i, clusterEnd=list[i].en; const cluster=[list[i]];
      while(j+1<list.length && list[j+1].s<clusterEnd){ j++; cluster.push(list[j]); clusterEnd=Math.max(clusterEnd,list[j].en); }
      const cc=[];
      for(const ev of cluster){ let placed=false;
        for(let c=0;c<cc.length;c++){ if(cc[c]<=ev.s){ ev.col=c; cc[c]=ev.en; placed=true; break; } }
        if(!placed){ ev.col=cc.length; cc.push(ev.en); } }
      cluster.forEach(ev=>ev.ncols=cc.length);
      i=j+1;
    }
    // a real conflict needs overlapping clock time AND overlapping weeks of the term
    for(let a=0;a<list.length;a++) for(let b=a+1;b<list.length;b++){
      const x=list[a],y=list[b];
      if(x.s<y.en && y.s<x.en && partsOverlap(x.part,y.part)){ x.hard=true; y.hard=true; conflictAny=true; }
    }
  }
  const wk={}; SDAYS.forEach(d=>{ const D=dateOf(d); wk[d]=(D.getMonth()+1)+"/"+D.getDate(); });
  const dayHead=SDAYS.map(d=>`<div class="d ${d===showToday?'today':''}"><span class="dn">${SDAY_LABEL[d]}</span><span class="dd">${wk[d]}</span></div>`).join("");
  const gutter=Array.from({length:rows},(_,k)=>{const tm=(startH+k)*60;const top=((tm-gStart)/total)*100;
    return `<div class="hr" style="top:${top}%">${min2label(tm)}</div>`;}).join("");
  const cols=SDAYS.map(d=>{
    const blocks=byDay[d].map(ev=>{
      const top=((ev.s-gStart)/total)*100, h=((ev.en-ev.s)/total)*100;
      const w=100/ev.ncols, left=ev.col*w, dur=ev.en-ev.s;
      const showLoc=dur>=50 && ev.ncols===1;
      const timeLbl=`${min2label(ev.s).replace(/[ap]m$/,'')}–${min2label(ev.en).replace(/[ap]m$/,'')}`;
      // A half-term meeting gets a small H1/H2 corner tag (top-right, opposite the TA/Audit tag) so
      // it's clear at a glance which 7-week half it runs. The section (LEC 001) is still dropped from
      // the block to cut clutter — it lives in the course editor.
      const cls=["ev"]; if(ev.hard)cls.push("conflict"); if(ev.ncols>1)cls.push("narrow"); if(dur<=55)cls.push("short");
      const _r=roleOf(ev.e), roleWord=_r==='audit'?'AUDIT':(_r==='ta_paid'||_r==='ta_credit')?'TA':'';
      const _p=partOf(ev.m), halfLbl=_p==='1'?'H1':_p==='2'?'H2':'';
      const tags=[halfLbl,roleWord].filter(Boolean);
      return `<div class="${cls.join(' ')}" data-cid="${ev.e.id}"${tags.length?' data-tags':''} style="--h:${SCHED_COLORS[ev.ci]};top:${top}%;height:${h}%;left:calc(${left}% + 1px);width:calc(${w}% - 2px)">
        <div class="c">${esc(ev.e.code||'—')}</div>
        <div class="et">${esc(timeLbl)}</div>
        ${showLoc&&ev.m.location?`<div class="loc">${esc(ev.m.location)}</div>`:''}
        ${tags.length?`<div class="ev-tags">${esc(tags.join(' · '))}</div>`:''}
      </div>`;
    }).join("");
    const ablocks=(asgBlocksByDay[d]||[]).map(b=>{ const a=b.a;
      const top=((b.s-gStart)/total)*100, h=((b.en-b.s)/total)*100;
      const kindLbl=((_ASG_K[a.kind]||{}).label||'').toUpperCase();
      return `<div class="sched-asg${a.done?' done':''}" data-asgid="${a.id}" style="--h:${b.color};top:${top}%;height:${h}%">
        <div class="ac">${esc(kindLbl)}</div><div class="at">${esc(asgTitle(a))}</div></div>`;
    }).join("");
    return `<div class="sched-col ${d===showToday?'today':''}">${blocks}${ablocks}</div>`;
  }).join("");
  const unschedHtml=unsched.length?`<div class="sched-unsched"><div class="h">No set meeting time</div>${
    unsched.map(e=>`<span class="uchip" data-cid="${e.id}"><span class="dot" style="background:${SCHED_COLORS[cidxOf(e)]}"></span>${esc(codeLabel(e))}<small>${crd(num(e.credits))}</small></span>`).join("")
  }</div>`:"";
  const termOpts=termList.map(t=>`<option value="${t.id}" ${t.id===SCHED_TERM?'selected':''}>${esc(t.name)}</option>`).join("")||`<option>No terms</option>`;
  const scount=`<span class="scount">${es.length} course${es.length===1?'':'s'} · ${crd(credits)}</span>`;
  const conflictNote=conflictAny?`<small class="cf">⚠ conflict</small>`:'';
  const nowEls = SCHED_NOW ? `<div class="now-time" style="display:none"></div><div class="now-line" style="display:none"></div>` : '';
  // academic-calendar overlay strip for the visible week — compact clickable chips; tapping a day
  // opens a detail sheet with the full titles/times, so nothing is truncated and busy days stay tidy.
  const adDays=[];
  const adcols=SDAYS.map((d,di)=>{ const D=dateOf(d);
    const evs=ac.overlay.filter(o=>D>=o.s&&D<=o.e);
    // deadlines sorted by time (all-day sink to the bottom); academic notices lead the day.
    const asgs=(asgChipsByDay[d]||[]).slice().sort((a,b)=>{ const ta=a.time?hm2min(String(a.time).slice(0,5)):1e9, tb=b.time?hm2min(String(b.time).slice(0,5)):1e9; return ta-tb; });
    adDays.push({label:`${SDAY_LABEL[d]}, ${ACAL_MONTHS[D.getMonth()]} ${D.getDate()}`, events:evs, asgs});
    const items=[...evs.map(o=>({ac:true,o})), ...asgs.map(r=>({ac:false,r}))];
    let chips=items.slice(0,2).map(it=> it.ac
      ? `<div class="adchip${it.o.noclass?' noclass':''}">${esc(acalShort(it.o.title))}</div>`
      : `<div class="adchip asg${it.r.a.done?' done':''}" style="border-left-color:${it.r.color};background:color-mix(in srgb,${it.r.color} 10%,var(--surface))"><span class="adchip-body"><span class="adchip-t">${esc(asgTitle(it.r.a))}</span>${it.r.time?`<span class="adchip-tm">${esc(asgTimeShort(it.r.time))}</span>`:''}</span></div>`).join("");
    if(items.length>2) chips+=`<div class="adchip more">+${items.length-2} more</div>`;
    return `<div class="ad-col${isNoClassDay(D,ac)?' noclass':''}${sameDay(D,todayD)?' today':''}${items.length?' has-ev':''}" data-adcol="${di}">${chips}</div>`; }).join("");
  const hasAd=adDays.some(x=>x.events.length||x.asgs.length);
  const alldayHtml=hasAd?`<div class="sched-allday"><div class="ad-gut"></div>${adcols}</div>`:"";
  // week navigator (bounded to the term); "Today" resets to the current/opening week
  const wkbar=(term&&(termHasTimed||ac.has))
    ? `<div class="schedweek"><button class="wknav" id="wkPrev" aria-label="Previous week"${weekMon<=firstMon?' disabled':''}>‹</button><span class="wklbl">${esc(weekLabel(weekMon))}</span><button class="wknav" id="wkNext" aria-label="Next week"${weekMon>=lastMon?' disabled':''}>›</button>${!sameDay(weekMon,defaultWeekMon(term))?`<button class="wknow" id="wkNow">Today</button>`:''}</div>`

  clearInterval(schedNowTimer); schedNowTimer=null;
  if(SCHED_NOW){ updateNowLine(); schedNowTimer=setInterval(updateNowLine, 20000); }

}
// Size the weekly grid to the remaining viewport so the page itself never scrolls.
// The grid's bottom edge is pinned just above the actual bottom nav (measured, not
// guessed) — and the schedule page drops .main's tall scroll padding via .main.fit —
// so nothing spills under the nav and the document height never exceeds the viewport.
function fitSchedule(){
  const wrap=$("#schedule .sched"); if(!wrap) return;
  // Mobile: the whole schedule page is locked to the viewport between the fixed bars
  // via a fixed-height flex layout (.main.fit below), so the grid fills by CSS and the
  // page physically cannot scroll — no measured height needed, and none of the earlier
  // window.innerHeight / nav-position guessing that iOS kept getting wrong.
  if(matchMedia("(max-width:760px)").matches){ wrap.style.height=""; return; }
  const body=wrap.querySelector(".sched-body"); if(!body){ wrap.style.height=""; return; }
  const top=wrap.getBoundingClientRect().top;
  const h=Math.round((window.innerHeight-28)-top);   // desktop breathing room
  wrap.style.height=Math.max(320,h)+"px";
}

function termGpa(es){ let q=0,c=0; for(const e of es){ const p=GRADE_POINTS[e.grade]; if(p==null||!e.counts_gpa) continue; q+=p*num(e.credits); c+=num(e.credits);} return c?q/c:null; }

/* ---- academic calendar ----
   Cornell's registrar page has no CORS headers, so the edge function scrapes it
   server-side (deterministic regex, no AI) and returns {title, events:[{month,date,time,title}]}.
   We cache the result in localStorage (6h) so the tab opens instantly and only
   re-fetches when stale or on an explicit refresh. Past dates dim; the first
   still-upcoming entry is highlighted so "where are we now" is obvious. */
const ACAL_MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function acalYear(ev){ const m=/(\d{4})/.exec(ev.month||""); return m?+m[1]:new Date().getFullYear(); }
function acalStart(ev){ const m=/([A-Z][a-z]{2})\s+(\d{1,2})/.exec(ev.date||""); if(!m) return null; const mo=ACAL_MON[m[1]]; if(mo==null) return null; return new Date(acalYear(ev),mo,+m[2]); }
function acalEnd(ev){ const all=[...String(ev.date||"").matchAll(/([A-Z][a-z]{2})\s+(\d{1,2})/g)]; if(all.length<2) return acalStart(ev); const last=all[all.length-1]; const mo=ACAL_MON[last[1]]; const s=acalStart(ev); if(mo==null||!s) return s; let y=acalYear(ev); if(mo<s.getMonth()) y++; return new Date(y,mo,+last[2]); }
// Normalize the registrar's raw time strings for display (deterministic; keeps the
// raw value in cache). Fixes ALL-CAPS "DEADLINE", and collapses whole-day multi-day
// spans ("Oct 15 12:00 AM – Oct 22 11:59 PM") to "All day" since the date column
// already shows the span. Real windows (e.g. the Nov 7:30 AM enrollment windows,
// "10:00 AM – 2:00 PM") are left exactly as-is so nothing is misrepresented.
function acalTime(raw){
  const t=String(raw||"").trim();
  if(!t) return "";
  if(/^all day$/i.test(t)) return "All day";
  const dl=/^deadline\s+(.+)$/i.exec(t); if(dl) return "Deadline "+dl[1].trim();
  const sp=/^[A-Z][a-z]{2}\s+\d{1,2}\s+(1?\d:\d{2}\s*[AP]M)\s*[–-]\s*[A-Z][a-z]{2}\s+\d{1,2}\s+(1?\d:\d{2}\s*[AP]M)$/.exec(t);
  if(sp && /^12:00 AM$/i.test(sp[1].replace(/\s+/g," ")) && /^11:59 PM$/i.test(sp[2].replace(/\s+/g," "))) return "All day";
  return t;
}

// Focus term for the agenda: the term containing today, else the nearest upcoming term.

function agColorMap(termId){ return assignCourseColors((DB.enrollments||[]).filter(e=>e.term_id===termId&&displayStatus(e)!=="wishlist")); }
function agFmtSec(iso,tstr){ const p=iso.split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]);
  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
  const md=`${ACAL_MONTHS[+p[1]-1]} ${+p[2]}`;
  const td=new Date(+tstr.slice(0,4),+tstr.slice(5,7)-1,+tstr.slice(8,10));
  const dd=Math.round((d-td)/864e5); const lead=dd===0?"Today":dd===1?"Tomorrow":dow;
  return `<span>${lead}</span><span class="ag-sec-d">· ${md}</span>`; }
function renderAssignments(){

    .filter(it=>it.en && it.on && (it.on>=t || it.over));
