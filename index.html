<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carnelian</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnelian">
<meta name="theme-color" content="#A81F23">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
  :root{
    --bg:#FAF7F4; --surface:#FFFFFF; --surface-2:#F4EFEA; --surface-3:#EFE8E2;
    --line:#EBE3DC; --line-strong:#DCD1C8; --ink:#1E1A18; --ink-2:#6C625B; --ink-3:#9C9188;
    --accent:#A81F23; --accent-ink:#FFFFFF; --accent-soft:#F8E9E7; --accent-line:#E9C9C6;
    --ok:#2E8B57; --ok-bg:#E4F1E9; --ok-line:#BFE0CC; --warn:#B9770F; --warn-bg:#F8EDD6; --warn-line:#EAD3A0;
    --plan:#39699F; --plan-bg:#E7EEF6; --plan-line:#C7D8EA;
    --shadow:0 1px 2px rgba(60,40,30,.04), 0 12px 30px -18px rgba(80,40,30,.28);
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --r:14px; --r-sm:10px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#141110; --surface:#1D1917; --surface-2:#241E1B; --surface-3:#2B2420;
    --line:#332B26; --line-strong:#43382F; --ink:#F2EBE5; --ink-2:#B4A79E; --ink-3:#80736A;
    --accent:#EA6A63; --accent-ink:#1a0e0d; --accent-soft:#2C1614; --accent-line:#4a2723;
    --ok:#5FBE86; --ok-bg:#16271E; --ok-line:#284835; --warn:#E0A84C; --warn-bg:#2A2113; --warn-line:#4a3a1e;
    --plan:#77A5D8; --plan-bg:#15212E; --plan-line:#294055;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --bg:#141110; --surface:#1D1917; --surface-2:#241E1B; --surface-3:#2B2420;
    --line:#332B26; --line-strong:#43382F; --ink:#F2EBE5; --ink-2:#B4A79E; --ink-3:#80736A;
    --accent:#EA6A63; --accent-ink:#1a0e0d; --accent-soft:#2C1614; --accent-line:#4a2723;
    --ok:#5FBE86; --ok-bg:#16271E; --ok-line:#284835; --warn:#E0A84C; --warn-bg:#2A2113; --warn-line:#4a3a1e;
    --plan:#77A5D8; --plan-bg:#15212E; --plan-line:#294055;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box} html,body{margin:0}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%} /* no double-tap / pinch zoom, no iOS auto text inflation */
  body{background:var(--bg); color:var(--ink); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0; letter-spacing:-.01em}
  button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
  input,select{font-family:inherit; font-size:14px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

  .gate{position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:var(--bg); z-index:100}
  .gatecard{width:100%; max-width:360px; text-align:center}
  .gatecard .mark{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;margin:0 auto 16px}
  .gatecard h1{font-size:22px; font-weight:800}
  .gatecard p{color:var(--ink-2); font-size:13px; margin:8px 0 20px}
  .gatecard input{width:100%; padding:12px 14px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); color:var(--ink); text-align:center; letter-spacing:.1em; margin-bottom:10px}
  .gatecard button{width:100%; padding:12px; border-radius:10px; background:var(--accent); color:#fff; font-weight:700}
  .gatecard .msg{font-size:12.5px; margin-top:12px; min-height:18px} .gatecard .msg.err{color:var(--accent)}

  .app{display:grid; grid-template-columns:236px 1fr; min-height:100vh}
  .rail{background:var(--surface); border-right:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; gap:16px; position:sticky; top:0; height:100vh; overflow:auto}
  .brand{display:flex; align-items:center; gap:10px; padding:2px 6px}
  .brand .mk{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
  .brand .wm{font-weight:800; letter-spacing:-.02em; font-size:16px}
  .brand .wm small{display:block;font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;margin-top:-1px}
  .gpas{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .gpa{border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 10px}
  .gpa.active{background:var(--accent); border-color:var(--accent)}
  .gpa .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--ink-3)}
  .gpa.active .k{color:rgba(255,255,255,.85)} .gpa .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .gpa.active .v{color:#fff} .gpa .v small{font-size:11px;color:var(--ink-3);font-weight:600}
  .nav{display:flex;flex-direction:column;gap:2px}
  .navlabel{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:10px 10px 4px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:left;width:100%}
  .navitem svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7}
  .navitem:hover{background:var(--surface-2);color:var(--ink)} .navitem.on{background:var(--accent-soft);color:var(--accent)}
  .navitem .badge{margin-left:auto;font-size:10px;font-weight:800;color:var(--ink-3)}
  .prog{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;color:var(--ink-2);width:100%;text-align:left}
  .prog:hover{background:var(--surface-2)} .prog .st{width:8px;height:8px;border-radius:99px;flex:0 0 auto}
  .prog .st.act{background:var(--accent)} .prog .st.done{background:var(--ok)}
  .rail-foot{margin-top:auto;display:flex;gap:8px;padding:6px;flex-wrap:wrap}
  .tbtn{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
  .tbtn:hover{background:var(--surface-2);color:var(--ink)}

  .main{min-width:0;padding:26px 30px 60px}
  .phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
  .phead h1{font-size:25px;font-weight:800;margin-top:5px} .phead p{color:var(--ink-2);font-size:13px;margin-top:5px}
  .phead .actions{margin-left:auto;display:flex;gap:9px}
  .btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border-radius:9px;padding:8px 13px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
  .btn:hover{background:var(--surface-2)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .page{display:none} .page.on{display:block}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px 17px} .muted{color:var(--ink-3)}
  .ctitle{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:13px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px} .grid-2{display:grid;grid-template-columns:1.25fr .75fr;gap:13px}

  .pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
  .pill.d{background:var(--ok-bg);color:var(--ok)} .pill.p{background:var(--warn-bg);color:var(--warn)}
  .pill.b{background:var(--plan-bg);color:var(--plan)} .pill.o{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line-strong)}
  .pill.t{background:var(--surface-2);color:var(--ink-2)}
  .dot{width:10px;height:10px;border-radius:99px;flex:0 0 auto;display:inline-block}
  .dot.d{background:var(--ok)} .dot.p{background:var(--warn)} .dot.b{background:var(--plan)} .dot.o{background:transparent;border:1.6px dashed var(--line-strong)} .dot.t{background:var(--ink-3)}
  .term{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
  .term.only{background:var(--warn-bg);color:var(--warn)}
  .bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex} .bar i{display:block;height:100%;background:var(--ok)} .bar i.part{background:var(--warn)}

  .trophy{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:var(--r);background:linear-gradient(100deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--line);border-left:3px solid var(--ok);margin-bottom:18px;box-shadow:var(--shadow)}
  .trophy .t{font-weight:800;font-size:13.5px} .trophy .s{font-size:12px;color:var(--ink-2);margin-top:1px}
  .progrow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
  .pcard2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow);cursor:pointer;text-align:center}
  .pcard2 .ring{position:relative;width:56px;height:56px;margin:0 auto 8px}
  .pcard2 .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
  .pcard2 .nm{font-size:12px;font-weight:700;line-height:1.25} .pcard2 .sub{font-size:10.5px;color:var(--ink-3);margin-top:2px}

  .bucket{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;background:var(--surface);box-shadow:var(--shadow)}
  .bucket .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .bucket .nm{font-weight:800;font-size:13.5px} .bucket .cr{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--ink-2)}
  .bucket .kind{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:4px 0 11px}
  .bucket .foot{margin-top:10px;font-size:11px;font-weight:800;color:var(--warn)} .bucket .foot.ok{color:var(--ok)}

  .switch{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
  .chip:hover{background:var(--surface-2)} .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip .st{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:6px;background:var(--ok)} .chip.on .st{background:#fff}

  .req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow)}
  .req .bh{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
  .req .bh:hover{background:var(--surface-2)}
  .req .chev{width:12px;color:var(--ink-3);transition:transform .2s} .req.open .chev{transform:rotate(90deg)}
  .req .nm{font-weight:800;font-size:13.5px} .req .cr{font-family:var(--font-mono);font-weight:800;font-size:12.5px;margin-left:auto}
  .req .mini{width:80px;height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;flex:0 0 auto} .req .mini i{display:block;height:100%;background:var(--ok)}
  .req .body{border-top:1px solid var(--line);padding:6px 16px 12px;display:none} .req.open .body{display:block}
  .crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .crow:last-child{border-bottom:0} .crow .co{font-family:var(--font-mono);font-weight:700;cursor:pointer} .crow .ti{color:var(--ink-2)} .crow .grow{flex:1 1 55%;min-width:0}
  .child{padding-left:12px;border-left:2px solid var(--surface-3);margin:6px 0 6px 2px}

  .scroller{overflow-x:auto;padding-bottom:8px} .board{display:flex;gap:13px;min-width:min-content}
  .col{width:210px;flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .col .ch{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;padding:2px 3px}
  .col .ch .t{font-weight:800;font-size:12.5px} .col .ch .cd{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-3)}
  .pcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:var(--r-sm);padding:9px 10px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
  .pcard.d{border-left-color:var(--ok)} .pcard.p{border-left-color:var(--warn)} .pcard.b{border-left-color:var(--plan)}
  .pcard .co{font-family:var(--font-mono);font-weight:700;font-size:12.5px} .pcard .ti{font-size:11.5px;color:var(--ink-2);margin:2px 0 6px}
  .pcard .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap} .pcard .cc{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);font-weight:700;margin-left:auto}
  .col .foot{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--ink-2);padding:8px 3px 2px;border-top:1px dashed var(--line-strong);margin-top:2px}
  .ghost{border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:9px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-3);cursor:pointer}

  .career{margin-bottom:22px} .career .ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .career .ch h3{font-size:16px;font-weight:800} .career .ch .g{margin-left:auto;font-family:var(--font-mono);font-weight:800;font-size:14px}
  .career .ch .g small{color:var(--ink-3);font-weight:700;font-size:11px}
  .tterm{border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden;background:var(--surface)}
  .tterm .th{display:flex;align-items:center;gap:10px;padding:10px 15px;background:var(--surface-2)}
  .tterm .th .nm{font-weight:800;font-size:13px} .tterm .th .meta{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);font-weight:700}
  .trow{display:grid;grid-template-columns:88px 1fr 44px 42px;gap:12px;align-items:center;padding:8px 15px;border-top:1px solid var(--line);font-size:12.5px;cursor:pointer}
  .trow:hover{background:var(--surface-2)} .trow .co{font-family:var(--font-mono);font-weight:700} .trow .co.nonas{color:var(--accent)} .trow .ti{color:var(--ink-2)}
  .trow .cc{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);text-align:right} .trow .gr{font-family:var(--font-mono);font-weight:800;text-align:right}
  .gr.a{color:var(--ok)} .gr.s{color:var(--ink-3)}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .wc .co{font-family:var(--font-mono);font-weight:800;font-size:14px} .wc .ti{font-size:12.5px;color:var(--ink-2);margin:2px 0 10px}
  .wc .meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

  .modal{position:fixed;inset:0;background:rgba(20,12,10,.45);display:none;place-items:center;padding:20px;z-index:80} .modal.on{display:grid}
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);max-height:92vh;overflow:auto}
  .sheet .sh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)} .sheet .sh h3{font-size:16px;font-weight:800} .sheet .sh .x{margin-left:auto;font-size:20px;color:var(--ink-3);width:30px;height:30px;border-radius:8px}
  .sheet .sb{padding:16px 18px;display:grid;gap:12px}
  .fld{display:grid;gap:5px} .fld label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
  .fld input,.fld select{padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lookup{display:flex;gap:8px} .lookup input{flex:1}
  .chkline{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .satbox{border:1px solid var(--line);border-radius:9px;max-height:170px;overflow:auto;padding:6px}
  .satgrp{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding:6px 6px 3px}
  .satopt{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:12px;border-radius:6px} .satopt:hover{background:var(--surface-2)}
  .sheet .sf{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--line)} .sheet .sf .btn{flex:1;justify-content:center} .sheet .sf .del{flex:0 0 auto;color:var(--accent);border-color:var(--accent-line)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:12.5px;font-weight:700;opacity:0;transition:.25s;z-index:120;pointer-events:none} .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .mobar{display:none}
  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .mobar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:60;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
    .mobar .brand{padding:0} .mobar .tbtn{margin-left:auto}
    .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;width:auto;flex-direction:row;gap:0;padding:5px 4px calc(5px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:60;overflow:visible}
    .rail .brand,.rail .gpas,.rail .navlabel,.rail .prog,.rail .rail-foot{display:none}
    .rail .nav{flex-direction:row;width:100%;gap:0}
    .navitem{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10px;justify-content:center;text-align:center;border-radius:8px} .navitem svg{width:21px;height:21px} .navitem .badge{display:none}
    .main{padding:64px 15px 82px} .phead h1{font-size:21px} .phead .actions{margin-left:0;width:100%} .phead .actions .btn{flex:1;justify-content:center}
    .grid-2,.grid-3{grid-template-columns:1fr} .progrow{grid-template-columns:repeat(2,1fr)} .wgrid{grid-template-columns:1fr}
    .switch{overflow-x:auto;flex-wrap:nowrap} .switch .chip{flex:0 0 auto} .frow{grid-template-columns:1fr} .trow{grid-template-columns:72px 1fr 30px 34px;gap:8px}
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gatecard">
    <div class="mark">C</div>
    <h1 id="gateTitle">Carnelian</h1>
    <p id="gateSub">Checking…</p>
    <form id="gateForm" style="display:none">
      <input id="gateInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="PIN" aria-label="PIN">
      <input id="gateInput2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="confirm PIN" aria-label="confirm PIN" style="display:none">
      <button id="gateBtn" type="submit">Enter</button>
    </form>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<header class="mobar" style="display:none">
  <div class="brand"><div class="mk" style="width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800">C</div><div class="wm">Carnelian</div></div>
  <button class="tbtn js-theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Theme</button>
</header>

<div class="app" id="app" style="display:none">
  <aside class="rail">
    <div class="brand"><div class="mk">C</div><div class="wm">Carnelian<small>degree command</small></div></div>
    <div class="gpas" id="railGpas"></div>
    <nav class="nav">
      <button class="navitem on" data-nav="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button class="navitem" data-nav="requirements"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Requirements</button>
      <button class="navitem" data-nav="planner"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Planner</button>
      <button class="navitem" data-nav="transcript"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Transcript</button>
      <button class="navitem" data-nav="wishlist"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.3C1.1 8.5 2.6 5 6 5c2 0 3.2 1.2 4 2.4C10.8 6.2 12 5 14 5c3.4 0 4.9 3.5 3.2 6.7C19 15.6 12 20 12 20z"/></svg>Wishlist</button>
      <div class="navlabel">Programs</div>
      <div id="railPrograms"></div>
    </nav>
    <div class="rail-foot">
      <button class="tbtn js-theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Theme</button>
      <button class="tbtn" id="logoutBtn">Lock</button>
    </div>
  </aside>
  <main class="main">
    <section class="page on" id="dashboard"></section>
    <section class="page" id="requirements"></section>
    <section class="page" id="planner"></section>
    <section class="page" id="transcript"></section>
    <section class="page" id="wishlist"></section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sh"><h3 id="mTitle">Course</h3><button class="x" id="mClose">×</button></div>
    <div class="sb">
      <div class="fld"><label>Look up on Cornell roster</label>
        <div class="lookup"><input id="mLookup" placeholder="e.g. PHIL 2310"><button class="btn" id="mLookupBtn" type="button">Search</button></div>
        <div class="muted" id="mLookupMsg" style="font-size:11px"></div></div>
      <div class="frow">
        <div class="fld"><label>Code</label><input id="mCode" placeholder="PHIL 2200"></div>
        <div class="fld"><label>Credits</label><input id="mCredits" type="number" step="0.5" placeholder="3"></div>
      </div>
      <div class="fld"><label>Title</label><input id="mTitleIn" placeholder="Course title"></div>
      <div class="frow">
        <div class="fld"><label>Term</label><select id="mTerm"></select></div>
        <div class="fld"><label>Status</label><select id="mStatus">
          <option value="wishlist">Wishlist</option><option value="planned">Planned</option>
          <option value="in_progress">In progress</option><option value="completed">Completed</option>
          <option value="transferred">Transferred</option></select></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Grade</label><select id="mGrade"></select></div>
        <div class="fld"><label>Distribution / tags</label><input id="mTags" placeholder="SMR-AS, FWS"></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Analog of (Cornell course)</label><input id="mAnalog" placeholder="e.g. PHIL 2310"></div>
        <div class="fld"><label>Arts & Sciences credit?</label>
          <label class="chkline" style="padding-top:8px"><input type="checkbox" id="mInAs"> counts as A&amp;S</label></div>
      </div>
      <div class="fld"><label>Satisfies requirements</label>
        <div class="satbox" id="mSat"></div></div>
    </div>
    <div class="sf">
      <button class="btn del" id="mDelete" style="display:none">Delete</button>
      <button class="btn primary" id="mSave">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const FN = "https://uhwdnmbxiopfysodydty.supabase.co/functions/v1/carnelian";
const GRADE_POINTS = {"A+":4.3,"A":4.0,"A-":3.7,"B+":3.3,"B":3.0,"B-":2.7,"C+":2.3,"C":2.0,"C-":1.7,"D+":1.3,"D":1.0,"D-":0.7,"F":0.0};
let TOKEN = localStorage.getItem("carn_token") || "";
let DB = {}, ACTIVE_PROG = null, CUR = "dashboard";
const $ = (s,r=document)=>r.querySelector(s);
const num = v => v==null||v===""? 0 : (typeof v==="number"?v:parseFloat(v));
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(action, payload={}){
  const r = await fetch(FN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,token:TOKEN,...payload})});
  const j = await r.json(); if(!r.ok) throw Object.assign(new Error(j.error||"error"),{status:r.status}); return j;
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }

/* ---- auth ---- */
async function boot(){
  try{
    const st=await api("status");
    if(!st.initialized){ showGate("create"); return; }
    if(TOKEN){ try{ DB=(await api("load")).data; enterApp(); return; }catch(e){ if(e.status!==401) console.error(e); } }
    showGate("login");
  }catch(e){ $("#gateSub").textContent="Can't reach the server. Refresh to retry."; }
}
function showGate(mode){
  $("#gate").style.display="grid"; $("#app").style.display="none"; $(".mobar").style.display="none"; $("#gateForm").style.display="block";
  const c=$("#gateInput2");
  if(mode==="create"){ $("#gateTitle").textContent="Set your PIN"; $("#gateSub").textContent="Choose a 4-digit PIN. Stored only as a hash."; c.style.display="block"; $("#gateBtn").textContent="Create"; $("#gateForm").dataset.mode="create"; }
  else { $("#gateTitle").textContent="Carnelian"; $("#gateSub").textContent="Enter your PIN."; c.style.display="none"; $("#gateBtn").textContent="Enter"; $("#gateForm").dataset.mode="login"; }
  $("#gateInput").focus();
}
$("#gateForm").addEventListener("submit", async e=>{
  e.preventDefault(); const mode=$("#gateForm").dataset.mode, pc=$("#gateInput").value, msg=$("#gateMsg"); msg.className="msg";
  try{
    if(mode==="create"){ if(pc.length<4){msg.textContent="Enter a 4-digit PIN.";msg.classList.add("err");return;}
      if(pc!==$("#gateInput2").value){msg.textContent="PINs don't match.";msg.classList.add("err");return;}
      TOKEN=(await api("setup",{passcode:pc})).token; }
    else TOKEN=(await api("login",{passcode:pc})).token;
    localStorage.setItem("carn_token",TOKEN); DB=(await api("load")).data; enterApp();
  }catch(err){ msg.textContent=err.status===401?"Wrong passcode.":(err.message||"Error"); msg.classList.add("err"); }
});
function enterApp(){ $("#gate").style.display="none"; $("#app").style.display="grid"; if(innerWidth<=760)$(".mobar").style.display="flex";
  ACTIVE_PROG=(DB.programs.find(p=>p.kind==="grad")||DB.programs[0]||{}).id; renderAll(); }
$("#logoutBtn").addEventListener("click",()=>{ localStorage.removeItem("carn_token"); location.reload(); });

/* ---- helpers ---- */
const today=()=>new Date().toISOString().slice(0,10);
const termById=id=>DB.terms.find(t=>t.id===id);
function currentTerm(){ const t=today(); return DB.terms.find(x=>x.starts_on&&x.ends_on&&x.starts_on<=t&&t<=x.ends_on); }
function displayStatus(e){
  if(e.status==="wishlist"||e.status==="transferred") return e.status;
  const term=termById(e.term_id), t=today();
  if(e.grade&&GRADE_POINTS[e.grade]!=null) return "completed";
  if(term&&term.ends_on&&term.ends_on<t) return "completed";
  if(term&&term.starts_on&&term.starts_on<=t&&(!term.ends_on||t<=term.ends_on)) return "in_progress";
  return e.status==="completed"?"completed":"planned";
}
const STATUS_DOT={completed:"d",in_progress:"p",planned:"b",transferred:"t",wishlist:"o"};
const STATUS_LABEL={completed:"completed",in_progress:"in progress",planned:"planned",transferred:"transferred",wishlist:"wishlist"};
const codeForMatch=e=>(e.analog_of||e.code||"");
const subjectOf=e=>codeForMatch(e).trim().split(/\s+/)[0]||"";
const levelOf=e=>{ const m=codeForMatch(e).match(/(\d{3,4})/); return m?parseInt(m[1]):0; };
const isX9xx=e=>{ const l=levelOf(e); return l && (l%1000)>=900; };

function gpa(career){ let q=0,c=0; for(const e of DB.enrollments){ const t=termById(e.term_id); if((t?t.career:"undergrad")!==career) continue;
  const p=GRADE_POINTS[e.grade]; if(p==null||!e.counts_gpa) continue; q+=p*num(e.credits); c+=num(e.credits);} return c?{gpa:q/c,credits:c}:{gpa:null,credits:0}; }
function creditsScope(scope){ let c=0; for(const e of DB.enrollments){ const ds=displayStatus(e); if(!["completed","in_progress","transferred"].includes(ds)) continue;
  const t=termById(e.term_id), car=t?t.career:"undergrad";
  if(scope==="as"){ if(!e.in_as||car==="grad") continue; } else if(scope==="grad"){ if(car!=="grad") continue; } else { if(car==="grad") continue; }
  c+=num(e.credits);} return Math.round(c*10)/10; }

/* ---- engine ---- */
function satisfiers(reqId){ const ids=new Set((DB.satisfactions||[]).filter(s=>s.requirement_id===reqId).map(s=>String(s.enrollment_id)));
  return DB.enrollments.filter(e=>ids.has(String(e.id))&&displayStatus(e)!=="wishlist"); }
function autoMatch(req){ const spec=req.spec||{}, m=spec.match||{}; if(m.manual||m.scope||m.pool) return [];
  return DB.enrollments.filter(e=>{ if(displayStatus(e)==="wishlist") return false;
    if(m.attribute) return (e.tags||[]).includes(m.attribute);
    if(m.subject){ if(subjectOf(e)!==m.subject) return false; const l=levelOf(e);
      if(m.levelMin&&l<m.levelMin) return false; if(m.levelMax&&l>m.levelMax) return false;
      if(spec.exclude&&spec.exclude.x9xx&&isX9xx(e)) return false; return true; }
    if(m.codes) return m.codes.includes(e.code); return false; }); }
const childReqIds=id=>DB.requirements.filter(r=>r.parent_id===id).map(r=>r.id);
function matchedFor(req){ const map=new Map(); for(const rid of [req.id,...childReqIds(req.id)]) for(const e of satisfiers(rid)) map.set(String(e.id),e); for(const e of autoMatch(req)) map.set(String(e.id),e); return [...map.values()]; }
function reqProgress(req){
  const need=(req.spec&&req.spec.need)||{type:"courses",n:num(req.count_required||req.credits_required||1)};
  if(need.type==="flag"){ const done=(DB.settings&&DB.settings.flags&&DB.settings.flags[req.id])?1:0; return {done,need:1,met:done>=1,kind:"flag",courses:[]}; }
  if(need.type==="credits"){ const scope=req.spec&&req.spec.match&&req.spec.match.scope; const courses=scope?[]:matchedFor(req);
    const cr=scope?creditsScope(scope):courses.reduce((s,e)=>s+num(e.credits),0); return {done:Math.round(cr*10)/10,need:need.n,met:cr>=need.n,kind:"credits",courses}; }
  if(need.type==="coverage"){ const kids=DB.requirements.filter(r=>r.parent_id===req.id).sort((a,b)=>a.sort-b.sort);
    const cov=kids.filter(k=>matchedFor(k).length>0).length; return {done:cov,need:need.n,met:cov>=need.n,kind:"coverage",kids}; }
  const kids=DB.requirements.filter(r=>r.parent_id===req.id).sort((a,b)=>a.sort-b.sort);
  const courses=matchedFor(req); return {done:courses.length,need:need.n,met:courses.length>=need.n,kind:"courses",courses,kids};
}
function programProgress(prog){
  const top=DB.requirements.filter(r=>r.program_id===prog.id&&!r.parent_id).sort((a,b)=>a.sort-b.sort);
  const rows=top.map(r=>({req:r,...reqProgress(r)}));
  const ratios=rows.map(r=>r.need?Math.min(1,r.done/r.need):(r.met?1:0));
  const met=rows.every(r=>r.met);
  let pct=rows.length?Math.round(100*ratios.reduce((a,b)=>a+b,0)/rows.length):0;
  if(met) pct=100; else if(pct>=100) pct=99; // never show a full ring while anything is unmet
  return {prog,rows,pct,met};
}
function ring(pct,size){ const off=100-pct*0.973; const col=pct>=100?"var(--ok)":"var(--accent)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--surface-3)" stroke-width="4"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${pct*0.973} 100" transform="rotate(-90 18 18)"/></svg>`; }
const nf=n=>Number.isInteger(n)?n:(Math.round(n*10)/10);

/* ---- render ---- */
function renderAll(){ renderRail(); renderDashboard(); renderRequirements(); renderPlanner(); renderTranscript(); renderWishlist(); showPage(CUR); }
function renderRail(){
  const ug=gpa("undergrad"), gr=gpa("grad");
  $("#railGpas").innerHTML=`<div class="gpa"><div class="k">Undergrad</div><div class="v">${ug.gpa?ug.gpa.toFixed(2):"—"}</div></div><div class="gpa active"><div class="k">Baker GPA</div><div class="v">${gr.gpa?gr.gpa.toFixed(2):"—"}</div></div>`;
  $("#railPrograms").innerHTML=DB.programs.map(p=>{const pr=programProgress(p);return `<button class="prog" data-prog="${p.id}"><span class="st ${pr.met?'done':'act'}"></span> ${esc(p.name)}</button>`;}).join("");
  $("#railPrograms").querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>{ACTIVE_PROG=b.dataset.prog;renderRequirements();showPage("requirements");});
}
function renderDashboard(){
  const active=DB.programs.find(p=>p.id===ACTIVE_PROG)||DB.programs[0];
  const pr=active?programProgress(active):{rows:[],pct:0};
  const cur=currentTerm();
  const progCards=DB.programs.map(p=>{const q=programProgress(p);return `<div class="pcard2" data-prog="${p.id}"><div class="ring">${ring(q.pct,56)}<b>${q.pct}%</b></div><div class="nm">${esc(p.name)}</div><div class="sub">${q.met?'complete':q.rows.filter(r=>!r.met).length+' left'}</div></div>`;}).join("");
  const cards=pr.rows.map(r=>{ const left=r.kind==='flag'?(r.met?'done':'not done'):(r.met?'complete':nf(Math.max(0,r.need-r.done))+(r.kind==='credits'?' cr left':r.kind==='coverage'?' categories left':' left'));
    const p=r.need?Math.min(100,100*r.done/r.need):0;
    return `<div class="bucket"><div class="top"><span class="nm">${esc(r.req.name)}</span><span class="cr">${r.kind==='flag'?(r.met?'✓':'—'):nf(r.done)+' / '+nf(r.need)}</span></div>
      <div class="kind">${r.kind}</div><div class="bar"><i class="${r.met?'':'part'}" style="width:${p}%"></i></div>
      <div class="foot ${r.met?'ok':''}">${left}</div></div>`;}).join("");
  $("#dashboard").innerHTML=`<div class="phead"><div><div class="eyebrow">Mission Command</div><h1>Where you stand</h1>
    <p>${cur?('Current term — '+esc(cur.name)):'No active term right now.'}</p></div>
    <div class="actions"><button class="btn primary" onclick="openCourse()">＋ Add course</button></div></div>
    <div class="progrow">${progCards}</div>
    <div class="trophy"><span style="font-size:16px">🎓</span><div><div class="t">${esc(active?active.name:'')} · ${pr.pct}%</div>
      <div class="s">Undergrad GPA ${gpa('undergrad').gpa?.toFixed(2)||'—'} · ${creditsScope('as')} A&amp;S cr · ${creditsScope('all')} total cr</div></div></div>
    <div class="grid-3">${cards||'<p class="muted">No requirements.</p>'}</div>`;
  $("#dashboard").querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>{ACTIVE_PROG=b.dataset.prog;renderRequirements();showPage("requirements");});
}
function courseChip(e){ const ds=displayStatus(e); return `<span class="pill ${STATUS_DOT[ds]}"><b class="mono">${esc(e.code)}</b></span>`; }
function renderRequirements(){
  const active=DB.programs.find(p=>p.id===ACTIVE_PROG)||DB.programs[0];
  const pr=programProgress(active);
  const sw=DB.programs.map(p=>{const q=programProgress(p);return `<button class="chip ${p.id===ACTIVE_PROG?'on':''}" data-p="${p.id}">${q.met?'<span class="st"></span>':''}${esc(p.name)} · ${q.pct}%</button>`;}).join("");
  const body=pr.rows.map((r,i)=>{
    let inner="";
    if(r.kind==="coverage"){ inner=r.kids.map(k=>{const kc=matchedFor(k); const met=kc.length>0;
      return `<div class="crow"><span class="dot ${met?'d':'o'}"></span><span class="grow">${esc(k.name)}</span>${kc.map(courseChip).join(" ")||'<span class="pill o">open</span>'}</div>`;}).join(""); }
    else if(r.kind==="flag"){ inner=`<div class="crow"><span class="dot ${r.met?'d':'o'}"></span><span class="grow">${r.met?'Satisfied':'Not recorded'}</span></div>`; }
    else if(r.kind==="credits"){ const list=r.courses&&r.courses.length?r.courses.map(courseChip).join(" "):'<span class="muted">counts from your transcript</span>';
      inner=`<div class="crow"><span class="grow">${nf(r.done)} of ${nf(r.need)} credits</span></div><div class="crow" style="border:0">${list}</div>`; }
    else if(r.kids&&r.kids.length){ inner=r.kids.map(k=>{const kc=matchedFor(k);const met=kc.length>0;
      return `<div class="crow"><span class="dot ${met?'d':'o'}"></span><span class="grow">${esc(k.name)}</span>${kc.map(courseChip).join(" ")||'<span class="pill o">open</span>'}</div>`;}).join("");
      if(r.done<r.need) inner+=`<div class="crow"><span class="dot o"></span><span class="grow muted">${nf(r.need-r.done)} more course(s) needed</span></div>`; }
    else { const list=r.courses.map(e=>`<div class="crow"><span class="dot ${STATUS_DOT[displayStatus(e)]}"></span><span class="grow"><b class="co" onclick="openCourse('${e.id}')">${esc(e.code)}</b> <span class="ti">${esc(e.title||'')}</span></span><span class="pill ${STATUS_DOT[displayStatus(e)]}">${STATUS_LABEL[displayStatus(e)]}</span></div>`).join("");
      const open=r.done<r.need?`<div class="crow"><span class="dot o"></span><span class="grow muted">${nf(r.need-r.done)} more needed</span><span class="pill o">open</span></div>`:"";
      inner=list+open; }
    const p=r.need?Math.min(100,100*r.done/r.need):0;
    return `<div class="req ${i<3||!r.met?'open':''}"><button class="bh" onclick="this.parentElement.classList.toggle('open')">
      <span class="chev">›</span><span class="dot ${r.met?'d':'o'}"></span><span class="nm">${esc(r.req.name)}</span>
      <span class="mini"><i style="width:${p}%"></i></span>
      <span class="cr">${r.kind==='flag'?(r.met?'✓':'—'):nf(r.done)+'/'+nf(r.need)}</span></button>
      <div class="body">${inner}</div></div>`;}).join("");
  $("#requirements").innerHTML=`<div class="phead"><div><div class="eyebrow">What counts for what</div><h1>Requirements</h1>
    <p>${esc(active.name)} — ${pr.met?'complete':pr.pct+'% complete'}. Auto-allocated from your courses; open a course to map it manually.</p></div>
    <div class="actions"><button class="btn primary" onclick="openCourse()">＋ Add course</button></div></div>
    <div class="switch">${sw}</div>${body}`;
  $("#requirements").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ACTIVE_PROG=b.dataset.p;renderRequirements();renderRail();});
}
function renderPlanner(){
  const terms=[...DB.terms].sort((a,b)=>a.sort-b.sort);
  const wish=DB.enrollments.filter(e=>e.status==="wishlist");
  const stage=`<div class="col" style="border-style:dashed;background:var(--surface)"><div class="ch"><span class="t">Wishlist</span></div>${wish.map(e=>`<div class="pcard" onclick="openCourse('${e.id}')"><div class="co">${esc(e.code||'—')}</div><div class="ti">${esc((e.title||'').slice(0,26))}</div></div>`).join("")||'<div class="ghost" onclick="openCourse(null,{status:\'wishlist\'})">+ add</div>'}</div>`;
  const cols=terms.map(t=>{ const es=DB.enrollments.filter(e=>e.term_id===t.id); const cr=es.reduce((s,e)=>s+num(e.credits),0);
    const cards=es.map(e=>{const ds=displayStatus(e);return `<div class="pcard ${STATUS_DOT[ds]}" onclick="openCourse('${e.id}')"><div class="co">${esc(e.code||'—')}</div><div class="ti">${esc((e.title||'').slice(0,26))}</div><div class="mt"><span class="pill ${STATUS_DOT[ds]}">${STATUS_LABEL[ds]}</span><span class="cc">${num(e.credits)}</span></div></div>`;}).join("");
    return `<div class="col"><div class="ch"><span class="t">${esc(t.name)}</span><span class="cd">${t.career==='grad'?'MPS':''}</span></div>${cards||'<div class="ghost" onclick="openCourse(null,{term_id:\''+t.id+'\'})">+ add</div>'}<div class="foot"><span>${es.length}</span><span class="mono">${nf(cr)} cr</span></div></div>`;}).join("");
  $("#planner").innerHTML=`<div class="phead"><div><div class="eyebrow">When</div><h1>Planner</h1><p>Courses by term.</p></div><div class="actions"><button class="btn primary" onclick="openCourse()">＋ Add course</button></div></div><div class="scroller"><div class="board">${stage}${cols}</div></div>`;
}
function renderTranscript(){
  let html=`<div class="phead"><div><div class="eyebrow">The record</div><h1>Transcript</h1><p>Grades drive GPA, scoped per career. Red code = non-A&amp;S credit.</p></div><div class="actions"><button class="btn primary" onclick="openCourse()">＋ Add course</button></div></div>`;
  for(const [car,label] of [["undergrad","Undergraduate · Arts & Sciences"],["grad","Graduate · Baker MPS"]]){
    const terms=DB.terms.filter(t=>t.career===car).sort((a,b)=>a.sort-b.sort); const g=gpa(car); let body="";
    for(const t of terms){ const es=DB.enrollments.filter(e=>e.term_id===t.id); if(!es.length) continue;
      const tg=termGpa(es), cr=es.reduce((s,e)=>s+num(e.credits),0);
      body+=`<div class="tterm"><div class="th"><span class="nm">${esc(t.name)}</span><span class="meta">${nf(cr)} cr${tg!=null?' · '+tg.toFixed(2):''}</span></div>`+
        es.map(e=>{const p=GRADE_POINTS[e.grade];return `<div class="trow" onclick="openCourse('${e.id}')"><span class="co ${e.in_as?'':'nonas'}">${esc(e.code||'—')}</span><span class="ti">${esc(e.title||'')}</span><span class="cc">${num(e.credits)}</span><span class="gr ${p!=null?'a':'s'}">${esc(e.grade||(displayStatus(e)==='in_progress'?'···':'—'))}</span></div>`;}).join("")+`</div>`;}
    html+=`<div class="career"><div class="ch"><h3>${esc(label)}</h3><span class="g">${g.gpa?g.gpa.toFixed(2):'—'} <small>${g.credits?('· '+nf(g.credits)+' cr'):''}</small></span></div>${body||'<p class="muted">No courses yet.</p>'}</div>`;
  }
  $("#transcript").innerHTML=html;
}
function termGpa(es){ let q=0,c=0; for(const e of es){ const p=GRADE_POINTS[e.grade]; if(p==null||!e.counts_gpa) continue; q+=p*num(e.credits); c+=num(e.credits);} return c?q/c:null; }
function renderWishlist(){
  const w=DB.enrollments.filter(e=>e.status==="wishlist");
  $("#wishlist").innerHTML=`<div class="phead"><div><div class="eyebrow">Saved for later</div><h1>Wishlist</h1><p>Courses you're eyeing.</p></div><div class="actions"><button class="btn primary" onclick="openCourse(null,{status:'wishlist'})">＋ Add</button></div></div>
  <div class="wgrid">${w.map(e=>`<div class="card pad wc"><div class="co">${esc(e.code||'—')}</div><div class="ti">${esc(e.title||'')}</div><div class="meta">${(e.tags||[]).map(t=>`<span class="pill t">${esc(t)}</span>`).join("")}<span class="mono muted">${num(e.credits)} cr</span></div><button class="btn primary" style="width:100%;justify-content:center" onclick="openCourse('${e.id}')">Edit</button></div>`).join("")||'<p class="muted">Nothing saved yet.</p>'}</div>`;
}

/* ---- modal ---- */
let EDIT_ID=null;
function openCourse(id=null, preset={}){
  EDIT_ID=id; const e=id!=null?DB.enrollments.find(x=>String(x.id)===String(id)):preset;
  $("#mTitle").textContent=id!=null?"Edit course":"Add course";
  $("#mLookupMsg").textContent="";
  $("#mCode").value=e.code||""; $("#mTitleIn").value=e.title||""; $("#mCredits").value=e.credits!=null?num(e.credits):"";
  $("#mTerm").innerHTML=`<option value="">— none —</option>`+DB.terms.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join(""); $("#mTerm").value=e.term_id||"";
  $("#mStatus").value=e.status||"planned";
  $("#mGrade").innerHTML=`<option value="">—</option>`+["A+","A","A-","B+","B","B-","C+","C","C-","D+","D","D-","F","S","SX","SU"].map(g=>`<option>${g}</option>`).join(""); $("#mGrade").value=e.grade||"";
  $("#mTags").value=(e.tags||[]).join(", "); $("#mAnalog").value=e.analog_of||""; $("#mInAs").checked=e.in_as!==false&&e.in_as!=null?!!e.in_as:(e.in_as===undefined?true:false);
  if(id==null&&e.in_as===undefined) $("#mInAs").checked=true;
  // satisfies list
  const cur=new Set((DB.satisfactions||[]).filter(s=>String(s.enrollment_id)===String(id)).map(s=>s.requirement_id));
  let html="";
  for(const p of DB.programs){ const rs=DB.requirements.filter(r=>r.program_id===p.id); if(!rs.length) continue;
    html+=`<div class="satgrp">${esc(p.name)}</div>`+rs.map(r=>`<label class="satopt"><input type="checkbox" data-req="${r.id}" ${cur.has(r.id)?'checked':''}> ${esc(r.name)}</label>`).join(""); }
  $("#mSat").innerHTML=html;
  $("#mDelete").style.display=id!=null?"inline-flex":"none";
  $("#modal").classList.add("on");
}
$("#mClose").onclick=()=>$("#modal").classList.remove("on");
$("#modal").addEventListener("click",e=>{ if(e.target===$("#modal")) $("#modal").classList.remove("on"); });
const splitList=v=>v.split(",").map(s=>s.trim()).filter(Boolean);

$("#mLookupBtn").onclick=async()=>{
  const code=$("#mLookup").value.trim(); if(!code) return; const msg=$("#mLookupMsg"); msg.textContent="Searching…";
  try{ const info=await rosterLookup(code); if(!info){ msg.textContent="Not found on recent rosters."; return; }
    $("#mCode").value=code.toUpperCase(); if(info.title)$("#mTitleIn").value=info.title; if(info.credits)$("#mCredits").value=info.credits;
    if(info.tags&&info.tags.length){ const cur=splitList($("#mTags").value); $("#mTags").value=[...new Set([...cur,...info.tags])].join(", "); }
    msg.textContent="Filled from roster ("+info.roster+")."; }
  catch(err){ msg.textContent="Roster error."; }
};
async function rosterLookup(code){
  const parts=code.trim().toUpperCase().split(/\s+/); if(parts.length<2) return null; const sub=parts[0], nbr=parts[1];
  for(const roster of ["FA25","SP26","FA24"]){
    try{ const r=await fetch(`https://classes.cornell.edu/api/2.0/search/classes.json?roster=${roster}&subject=${sub}`);
      const j=await r.json(); if(j.status!=="success") continue;
      const cls=(j.data.classes||[]).find(c=>c.catalogNbr===nbr); if(!cls) continue;
      const eg=(cls.enrollGroups||[])[0]||{}; let tags=[];
      if(cls.crseAttrValueGroups&&cls.crseAttrValueGroups.length) cls.crseAttrValueGroups.forEach(g=>(g.crseAttrValues||"").split(",").forEach(v=>{const t=v.replace(/[()\s]/g,"");if(t)tags.push(t);}));
      else if(cls.catalogDistr) cls.catalogDistr.replace(/[()]/g," ").split(/[,\s]+/).forEach(t=>{if(t)tags.push(t);});
      return {title:cls.titleLong, credits:eg.unitsMaximum, tags, roster};
    }catch(e){}
  }
  return null;
}
$("#mSave").onclick=async()=>{
  const grade=$("#mGrade").value;
  const row={ code:$("#mCode").value.trim(), title:$("#mTitleIn").value.trim(), credits:num($("#mCredits").value),
    term_id:$("#mTerm").value||null, status:$("#mStatus").value, grade:grade||null, counts_gpa:GRADE_POINTS[grade]!=null,
    tags:splitList($("#mTags").value), analog_of:$("#mAnalog").value.trim()||null, in_as:$("#mInAs").checked };
  if(EDIT_ID!=null) row.id=EDIT_ID;
  try{
    const saved=(await api("upsert",{table:"enrollments",row})).row;
    if(EDIT_ID!=null){ const i=DB.enrollments.findIndex(x=>String(x.id)===String(EDIT_ID)); DB.enrollments[i]=saved; } else DB.enrollments.push(saved);
    const eid=saved.id;
    // sync satisfactions
    const want=new Set([...$("#mSat").querySelectorAll("input:checked")].map(c=>c.dataset.req));
    const have=(DB.satisfactions||[]).filter(s=>String(s.enrollment_id)===String(eid));
    for(const s of have) if(!want.has(s.requirement_id)){ await api("delete",{table:"satisfactions",id:s.id}); DB.satisfactions=DB.satisfactions.filter(x=>x.id!==s.id); }
    const haveSet=new Set(have.map(s=>s.requirement_id));
    for(const rid of want) if(!haveSet.has(rid)){ const r=(await api("upsert",{table:"satisfactions",row:{enrollment_id:eid,requirement_id:rid}})).row; (DB.satisfactions=DB.satisfactions||[]).push(r); }
    $("#modal").classList.remove("on"); renderAll(); toast("Saved");
  }catch(err){ toast(err.message||"Error"); }
};
$("#mDelete").onclick=async()=>{ if(EDIT_ID==null||!confirm("Delete this course?")) return;
  try{ await api("delete",{table:"enrollments",id:EDIT_ID}); DB.enrollments=DB.enrollments.filter(x=>String(x.id)!==String(EDIT_ID)); DB.satisfactions=(DB.satisfactions||[]).filter(s=>String(s.enrollment_id)!==String(EDIT_ID)); $("#modal").classList.remove("on"); renderAll(); toast("Deleted"); }catch(err){ toast(err.message||"Error"); } };

/* ---- nav/theme ---- */
function showPage(id){ CUR=id; document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id)); document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("on",n.dataset.nav===id)); scrollTo(0,0); }
document.querySelectorAll("[data-nav]").forEach(n=>n.addEventListener("click",()=>showPage(n.dataset.nav)));
const root=document.documentElement, mq=matchMedia("(prefers-color-scheme: dark)");
document.querySelectorAll(".js-theme").forEach(b=>b.addEventListener("click",()=>{const c=root.getAttribute("data-theme")||(mq.matches?"dark":"light");root.setAttribute("data-theme",c==="dark"?"light":"dark");}));
window.openCourse=openCourse;

/* ---- iOS zoom lock: block pinch + double-tap zoom ---- */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
/* ---- PIN: auto-submit at 4 digits ---- */
$("#gateInput").addEventListener("input",()=>{ if($("#gateForm").dataset.mode==="login" && $("#gateInput").value.length===4) $("#gateForm").requestSubmit(); });
$("#gateInput2").addEventListener("input",()=>{ if($("#gateInput").value.length===4 && $("#gateInput2").value.length===4) $("#gateForm").requestSubmit(); });

boot();
</script>
