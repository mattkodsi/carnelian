  let html=`<div class="agenda"><div class="ag-head"><h1>Assignments</h1><button class="ag-sync" id="agSync"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-.9 4.5"/><path d="M20 4v6h-6"/></svg>Sync</button></div>`;
  html+=`<div class="ag-count">${nPend?`${nPend} from Canvas to review · `:''}${nUp} upcoming</div>`;
  if(!items.length){ html+=`<div class="ag-empty">No assignments this term. Add them per course in the Planner, or use Sync to pull from Canvas.</div></div>`; el.innerHTML=html; wireAgenda(el); return; }
  if(overdue.length){ html+=`<div class="ag-sec overdue"><svg class="ico" style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.01"/><path d="M10.3 3.9 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Overdue</div>`+overdue.map(row).join(""); }
  days.forEach(d=>{ html+=`<div class="ag-sec">${agFmtSec(d,t)}</div>`+byDay[d].sort((x,y)=> cidxOf(x.en)-cidxOf(y.en) || String(x.tm||'~').localeCompare(String(y.tm||'~'))).map(row).join(""); });
  html+=`</div>`;
  el.innerHTML=html; wireAgenda(el);

function wireAgenda(el){
  const sb=$("#agSync"); if(sb) sb.onclick=async()=>{ if(CSYNC) return; sb.classList.add('spin'); sb.disabled=true;

  el.querySelectorAll("[data-approve]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const a=asgById(b.dataset.approve); if(a) approveAsg(a); });
  el.querySelectorAll("[data-reject]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const a=asgById(b.dataset.reject); if(a) rejectAsg(a); });
  el.querySelectorAll("[data-done]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation();
    const a=asgById(b.dataset.done); if(!a) return;
    // Optimistic: flip the visual state instantly, persist in the background, revert on error.
    const nv=!a.done, row=b.closest('.ag-row'); const paint=v=>{ a.done=v; if(row) row.classList.toggle('done',v); b.classList.toggle('on',v); b.innerHTML=v?ICO.check:''; };
    paint(nv);

  el.querySelectorAll("[data-open]").forEach(r=>r.onclick=()=>{ const a=asgById(r.dataset.open); if(a) openAsgEditor(a.enrollment_id,a); });
}

function paintAcademic(data,scroll){
  const body=$("#acal-body"); if(!body) return;
  const evs=data.events||[], note=$("#acal-note");
  if(note){ const when=data.at?new Date(data.at):null; note.innerHTML=`${esc(data.title||"Academic Calendar")} · Cornell Registrar${when?" · updated "+when.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+when.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):""}`; }
  if(!evs.length){ body.innerHTML=`<p class="muted">No calendar entries found.</p>`; return; }
  const today=new Date(); today.setHours(0,0,0,0);
  let nextIdx=-1;
  const meta=evs.map(ev=>{ const s=acalStart(ev), e=acalEnd(ev)||s; const past=!!(e&&e<today); const now=!!(s&&e&&s<=today&&today<=e); return {past,now}; });
  for(let i=0;i<meta.length;i++){ if(!meta[i].past){ nextIdx=i; break; } }
  let html="", curMonth=null;
  evs.forEach((ev,i)=>{
    if(ev.month!==curMonth){ if(curMonth!==null) html+=`</div>`; curMonth=ev.month; html+=`<div class="acal-month"><div class="acal-mh">${esc(ev.month||"")}</div>`; }
    const m=meta[i], cls=[m.past?"past":"", i===nextIdx?"next":""].filter(Boolean).join(" ");

let SEARCH_CACHE={}, searchTimer=null, MRESULTS=[];
const ROSTER_FALLBACK=["FA26","SP26","FA25","SP25","FA24"];
// which roster a search actually used, and whether it was recycled from an older same-season term
let CUR_ROSTER="", CUR_RECYCLED=false;
// map a DB term ("Fall 2026 · Baker", starts_on) to a Cornell roster code ("FA26")
function termRoster(t){ if(!t) return null; const nm=((t.name||'')+' '+(t.starts_on||''));
  let season=/spring/i.test(nm)?'SP':/summer/i.test(nm)?'SU':/winter/i.test(nm)?'WI':/fall|autumn/i.test(nm)?'FA':null;
  let ym=(/(20\d\d)/.exec(nm)||[])[1];
  if((!season||!ym)&&t.starts_on){ const mo=+t.starts_on.slice(5,7)||0; if(!season) season=mo<=1?'WI':mo<=5?'SP':mo<=7?'SU':'FA'; if(!ym) ym=t.starts_on.slice(0,4); }
  if(!season||!ym) return null; return season+String(ym).slice(2); }
// sortable key for a roster code so we can find the newest — e.g. FA26 -> 263, SP27 -> 271
const SEASON_ORD={WI:0,SP:1,SU:2,FA:3};
function rosterKey(r){ return (parseInt(r.slice(2),10)||0)*10 + (SEASON_ORD[r.slice(0,2)]??9); }
// the list of rosters Cornell has actually published (cached for the session + localStorage)
let AVAIL_ROSTERS=null, AVAIL_PROMISE=null;
async function availRosters(){
  if(AVAIL_ROSTERS) return AVAIL_ROSTERS;
  try{ const raw=localStorage.getItem("carn_rosters"); if(raw){ const o=JSON.parse(raw); if(o&&Array.isArray(o.items)&&o.items.length){ AVAIL_ROSTERS=o.items; } } }catch(e){}
  if(AVAIL_ROSTERS) return AVAIL_ROSTERS;
  if(AVAIL_PROMISE) return AVAIL_PROMISE;
  AVAIL_PROMISE=(async()=>{
    try{ const j=await (await fetch("https://classes.cornell.edu/api/2.0/config/rosters.json")).json();
      if(j.status==="success"){ const items=(j.data.rosters||[]).map(r=>r.slug).filter(Boolean);
        if(items.length){ AVAIL_ROSTERS=items; try{ localStorage.setItem("carn_rosters", JSON.stringify({items})); }catch(e){} return items; } } }catch(e){}
    AVAIL_ROSTERS=ROSTER_FALLBACK.slice(); return AVAIL_ROSTERS;   // offline fallback
  })();
  return AVAIL_PROMISE;
}
// Resolve the roster to actually search. If `ideal` is published, use it. Otherwise recycle the
// newest published roster of the SAME SEASON (SP27 -> SP26), since future terms have no roster yet.
// With no term, use the newest published roster. Returns {roster, recycled}.
async function resolveRoster(ideal){
  const avail=await availRosters();
  const sorted=avail.slice().sort((a,b)=>rosterKey(a)-rosterKey(b));
  const newest=sorted[sorted.length-1]||null;
  if(!ideal) return {roster:newest, recycled:false};
  if(avail.includes(ideal)) return {roster:ideal, recycled:false};
  const season=ideal.slice(0,2);
  const sameSeason=sorted.filter(r=>r.slice(0,2)===season);
  const pick=sameSeason.length?sameSeason[sameSeason.length-1]:newest;
  return {roster:pick, recycled:!!pick};
}
async function getSubjectClasses(sub, roster){
  if(!roster) return null;
  const key=roster+"|"+sub;
  if(SEARCH_CACHE[key]!==undefined) return SEARCH_CACHE[key];
  try{ const r=await fetch(`https://classes.cornell.edu/api/2.0/search/classes.json?roster=${roster}&subject=${sub}`); const j=await r.json();
    SEARCH_CACHE[key]=(j.status==="success")?(j.data.classes||[]):null; }
  catch(e){ SEARCH_CACHE[key]=null; }
  return SEARCH_CACHE[key];
}
// The roster's department codes (ASIAN, CS, HADM…), so a first word that isn't one routes to title
// search. Cached in memory + localStorage per roster.
let AVAIL_SUBJECTS={};
async function availSubjects(roster){
  if(!roster) return new Set();
  if(AVAIL_SUBJECTS[roster]) return AVAIL_SUBJECTS[roster];
  try{ const raw=localStorage.getItem("carn_subjects_"+roster); if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length){ return AVAIL_SUBJECTS[roster]=new Set(a); } } }catch(e){}
  try{ const j=await (await fetch(`https://classes.cornell.edu/api/2.0/config/subjects.json?roster=${roster}`)).json();
    if(j.status==="success"){ const subs=(j.data.subjects||[]).map(s=>s.value).filter(Boolean);
      if(subs.length){ try{ localStorage.setItem("carn_subjects_"+roster, JSON.stringify(subs)); }catch(e){} return AVAIL_SUBJECTS[roster]=new Set(subs); } } }catch(e){}
  return AVAIL_SUBJECTS[roster]=new Set();
}
// Full-catalog title index for a roster: [{s:subject, n:catalogNbr, t:title, u:credits}], built once by
// pulling every department (Cornell's API has no cross-catalog title search), cached to localStorage
// (~7-day TTL) so later name searches are instant. Reuses getSubjectClasses' cache.
let CATALOG={}, CATALOG_BUILDING={};
const CATALOG_TTL=7*24*3600*1000;
async function buildCatalog(roster, onProgress){
  if(!roster) return [];
  if(CATALOG[roster]) return CATALOG[roster];
  try{ const raw=localStorage.getItem("carn_catalog_"+roster); if(raw){ const o=JSON.parse(raw); if(o&&o.at&&(Date.now()-o.at<CATALOG_TTL)&&Array.isArray(o.index)&&o.index.length){ return CATALOG[roster]=o.index; } } }catch(e){}
  if(CATALOG_BUILDING[roster]) return CATALOG_BUILDING[roster];
  CATALOG_BUILDING[roster]=(async()=>{
    const subs=[...await availSubjects(roster)];
    if(!subs.length){ return CATALOG[roster]=[]; }
    const index=[]; let done=0, idx=0; const CONC=8;
    async function worker(){ while(idx<subs.length){ const sub=subs[idx++];
      const classes=await getSubjectClasses(sub, roster);
      if(classes) for(const c of classes){ const eg=(c.enrollGroups||[])[0]||{}; index.push({s:sub,n:c.catalogNbr,t:c.titleLong||"",u:eg.unitsMaximum!=null?eg.unitsMaximum:null}); }
      done++; if(onProgress) onProgress(done, subs.length); } }
    await Promise.all(Array.from({length:Math.min(CONC,subs.length)}, worker));
    try{ localStorage.setItem("carn_catalog_"+roster, JSON.stringify({at:Date.now(), index})); }catch(e){}
    return CATALOG[roster]=index;
  })();

// 'awaiting' (roster not out) · 'available' (out, needs times) · 'changed' (has times, title/credits
// differ) · 'notoffered' (course not in the published roster) · 'ok'.
async function courseRosterState(e){
  const ideal=termRoster(termById(e.term_id)); if(!ideal) return {state:'ok'};
  const avail=await availRosters(); if(!avail.includes(ideal)) return {state:'awaiting', ideal};
  const parts=(e.code||"").trim().toUpperCase().split(/\s+/); if(parts.length<2) return {state:'ok'};
  const classes=await getSubjectClasses(parts[0], ideal); const cls=classes&&classes.find(c=>c.catalogNbr===parts[1]);
  if(!cls) return {state:'notoffered', ideal};
  const eg=(cls.enrollGroups||[])[0]||{}; const rTitle=cls.titleLong||""; const rCr=(eg.unitsMaximum!=null?eg.unitsMaximum:eg.unitsMinimum);
  const diffs=[]; if(rTitle && rTitle!==(e.title||"")) diffs.push({field:"title", from:e.title||"", to:rTitle});
  if(rCr!=null && Number(rCr)!==Number(num(e.credits))) diffs.push({field:"credits", from:num(e.credits), to:Number(rCr)});

  // the user (their real section, credits, title) — re-flagging it against the roster's first section
  // would invite clobbering their intentional values, so we leave it alone.
  if(!hasTimes) return {state:'available', ideal, cls, diffs, single};

async function applyRosterUpdate(e, st, mode){

let RCHECK={ran:false, items:[]}, RCHECK_FLAG=new Set(), RCHECK_DISMISSED=new Set(), RCHECK_BUSY=false;
// opts.silent → don't toast/render here (the caller does), just return a summary string.
async function runRosterCheck(opts={}){

  let msg="";

    const cands=DB.enrollments.filter(e=>{const ds=displayStatus(e); return ds==="planned"||ds==="in_progress"||ds==="wishlist";});
    const states=await Promise.all(cands.map(async e=>({e, st:await courseRosterState(e)})));
    RCHECK.ran=true;
    RCHECK.items=states.filter(x=>["available","notoffered"].includes(x.st.state) && !RCHECK_DISMISSED.has(String(x.e.id)));
    RCHECK_FLAG=new Set(RCHECK.items.map(x=>String(x.e.id)));
    if(!opts.silent) renderPlanner();

    const bits=[]; if(n("available"))bits.push(n("available")+" with new roster data"); if(n("changed"))bits.push(n("changed")+" changed"); if(n("notoffered"))bits.push(n("notoffered")+" may not be offered");
    msg=bits.length?("Roster check — "+bits.join(" · ")):"Roster check — everything's current";

  if(!opts.silent && msg) toast(msg);

/* ---- search the WHOLE roster by course name (Title box) ----
   The Cornell API requires a subject per query, so a name search needs an index of
   every course in the term. We build a slim {subject, number, title} index once per
   roster (~280KB, ~4.5k courses) and cache it in localStorage, so it's a one-time
   cost; later name searches filter it instantly. Picking a result fetches just that
   one subject's full data to fill sections/meeting times (same path as the Code box). */
let TITLE_INDEX={}, TITLE_BUILDING={}, titleTimer=null, MTITLE=[];
async function ensureTitleIndex(roster, onProgress){
  if(TITLE_INDEX[roster]) return TITLE_INDEX[roster];
  try{ const raw=localStorage.getItem("carn_tidx_"+roster); if(raw){ const o=JSON.parse(raw); if(o&&o.v===1&&Array.isArray(o.items)&&o.items.length){ TITLE_INDEX[roster]=o.items; return o.items; } } }catch(e){}
  if(TITLE_BUILDING[roster]) return TITLE_BUILDING[roster];
  TITLE_BUILDING[roster]=(async()=>{
    let subs=[];
    try{ const j=await (await fetch(`https://classes.cornell.edu/api/2.0/config/subjects.json?roster=${roster}`)).json(); if(j.status==="success") subs=(j.data.subjects||[]).map(s=>s.value); }catch(e){}
    if(!subs.length){ TITLE_BUILDING[roster]=null; return null; }
    const items=[]; let done=0, i=0;
    async function worker(){ while(i<subs.length){ const s=subs[i++];
      try{ const j=await (await fetch(`https://classes.cornell.edu/api/2.0/search/classes.json?roster=${roster}&subject=${s}`)).json();
        if(j.status==="success") for(const c of (j.data.classes||[])) items.push({s, n:c.catalogNbr, t:c.titleLong||""}); }catch(e){}
      done++; if(onProgress&&done%6===0) onProgress(done,subs.length); } }
    await Promise.all(Array.from({length:8},()=>worker()));
    TITLE_INDEX[roster]=items;
    try{ localStorage.setItem("carn_tidx_"+roster, JSON.stringify({v:1,built:new Date().toISOString().slice(0,10),items})); }catch(e){}
    TITLE_BUILDING[roster]=null; return items;
  })();
  return TITLE_BUILDING[roster];
}

// iOS-style edge-swipe back on the transcript (a dashboard sub-page): drag from the left
// edge and the page slides off to the right, revealing the dashboard, then navigates back.
// No opacity fade — the sheet just translates. Only engages on phones, only on the transcript.
(function(){
  const EDGE=28, FRAC=0.32, VEL=0.5;   // start zone px, distance trigger (frac of width), velocity trigger px/ms
  let armed=false, active=false, sx=0, sy=0, t0=0, savedScroll=0, W=0, tEl=null, dEl=null, main=null;
  const isPhone=()=>matchMedia("(max-width:760px)").matches;
  function begin(){ active=true; main=document.querySelector(".main"); tEl=$("#transcript"); dEl=$("#dashboard");
    savedScroll=window.scrollY||0; W=window.innerWidth;
    dEl.classList.add("on"); main.classList.add("swiping");
    tEl.scrollTop=savedScroll;              // keep the same visual position once it becomes fixed
    tEl.style.transition="none"; tEl.style.transform="translateX(0px)"; }
  function finish(go){ let ended=false;
    const done=()=>{ if(ended) return; ended=true; clearTimeout(tm); tEl.removeEventListener("transitionend",done);
      if(go) showPage("dashboard");
      main.classList.remove("swiping"); tEl.style.transform=""; tEl.style.transition=""; tEl.scrollTop=0;
      if(!go){ dEl.classList.remove("on"); window.scrollTo(0,savedScroll); }
      armed=active=false; };
    tEl.addEventListener("transitionend",done);
    tEl.style.transition="transform .28s cubic-bezier(.33,.0,.2,1)";
    requestAnimationFrame(()=>{ tEl.style.transform = go ? "translateX("+W+"px)" : "translateX(0px)"; });
    const tm=setTimeout(done,360); }
  document.addEventListener("touchstart",e=>{ if(CUR!=="transcript"||!isPhone()||e.touches.length!==1) return;
    const t=e.touches[0]; if(t.clientX<=EDGE){ armed=true; active=false; sx=t.clientX; sy=t.clientY; t0=Date.now(); } },{passive:true});
  document.addEventListener("touchmove",e=>{ if(!armed) return; const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(!active){ if(dx>8 && dx>Math.abs(dy)) begin(); else if(Math.abs(dy)>10){ armed=false; return; } else return; }
    if(active){ e.preventDefault(); tEl.style.transform="translateX("+Math.max(0,dx)+"px)"; } },{passive:false});
  document.addEventListener("touchend",e=>{ if(!armed) return; if(!active){ armed=false; return; }
    const t=e.changedTouches[0], dx=Math.max(0,t.clientX-sx), dt=Math.max(1,Date.now()-t0), vel=dx/dt;
    finish(dx > W*FRAC || vel > VEL); },{passive:true});
})();

    $("#gcDisc").onclick=()=>armDel($("#gcDisc"),async()=>{ try{ await api("gcal_disconnect"); GCAL={connected:false,email:null,count:0,syncAcademic:false,academicCount:0,syncDeadlines:false,deadlineCount:0}; toast("Disconnected"); if(CUR==="schedule")renderSchedule(); renderGcalModal(); }catch(e){ toast(e.message||"Error"); } });
  } else {
    b.innerHTML=`<p class="hint" style="margin-top:2px">Add your classes to a dedicated <b>Carnelian</b> calendar in Google — recurring weekly through each term's end. Edits here keep it in sync.</p>
      <div class="gc-btns"><button class="btn primary" id="gcConn">Connect Google Calendar</button></div>`;
    $("#gcConn").onclick=gcalConnect;
  }
}

/* ============ Save schedule as a PNG image ============ */
function roundRectPath(x,X,Y,W,H,R){ R=Math.max(0,Math.min(R,W/2,H/2)); x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
// Greedy word-wrap for canvas text (used by the academic band so full titles never truncate).
// Long slash-joined tokens (e.g. "Graduate/Professional/Cornell") get soft breaks after each "/".
function wrapLines(x,text,maxW){
  const raw=String(text||'').split(/\s+/).filter(Boolean), words=[];
  for(const w of raw){ if(w.length>16 && w.indexOf('/')>=0){ const parts=w.split('/'); parts.forEach((p,i)=>words.push(i<parts.length-1?p+'/':p)); } else words.push(w); }
  const lines=[]; let cur='';
  for(const w of words){ const t=cur?(cur.slice(-1)==='/'?cur+w:cur+' '+w):w; if(!cur||x.measureText(t).width<=maxW){ cur=t; } else { lines.push(cur); cur=w; } }
  if(cur) lines.push(cur); return lines.length?lines:[''];
}
// weekMon set → snapshot the specific visible week (real dates, break/half-term suppression, matching
// the on-screen grid). weekMon null → the generic "typical week" (every meeting, both halves, no dates).
function schedImageData(termId, weekMon){
  const term=termById(termId);
  const es=DB.enrollments.filter(e=>e.term_id===termId&&displayStatus(e)!=="wishlist");
  const cidx={}; let ci=0; es.forEach(e=>{ const k=e.code||('#'+e.id); if(cidx[k]==null)cidx[k]=(ci++)%SCHED_COLORS.length; });
  const ac=weekMon?termAcademics(term):null;
  const dateOf=weekMon?(d=>{ const i=SDAYS.indexOf(d); return new Date(weekMon.getFullYear(),weekMon.getMonth(),weekMon.getDate()+i); }):null;
  const events=[];
  for(const e of es){ const ms=meetingsOf(e).filter(m=>m.days&&m.days.some(d=>SDAYS.includes(d))&&hm2min(m.start)!=null&&hm2min(m.end)!=null&&hm2min(m.end)>hm2min(m.start));
    for(const m of ms){ const part=partOf(m);
      for(const dd of m.days){ if(!SDAYS.includes(dd))continue;
        if(weekMon){ const D=dateOf(dd); if(isNoClassDay(D,ac)||!meetingActiveOn(part,D,ac)) continue; }
        events.push({e,ci:cidx[e.code||('#'+e.id)],day:dd,s:hm2min(m.start),en:hm2min(m.end),m}); } } }
  // assignments for the snapshot week (only meaningful when weekMon is set → real dates)
  const isoOf=D=>`${D.getFullYear()}-${String(D.getMonth()+1).padStart(2,"0")}-${String(D.getDate()).padStart(2,"0")}`;
  const asgWk=(weekMon&&typeof asgWeek==='function')?asgWeek(weekMon):{chips:[],blocks:[]};
  const asgBlocksByDay={}, asgChipsByDay={}; SDAYS.forEach(d=>{asgBlocksByDay[d]=[];asgChipsByDay[d]=[];});
  if(weekMon){ for(const r of asgWk.blocks){ const iso=r.iso||asgDate(r.a); const di=SDAYS.findIndex(d=>isoOf(dateOf(d))===iso); if(di<0)continue;
      const s=hm2min(String(r.a.due_time).slice(0,5)); if(s==null)continue; const en=s+Math.max(num(r.a.duration_min)||30,20); asgBlocksByDay[SDAYS[di]].push({...r,s,en}); }
    for(const r of asgWk.chips){ const iso=r.iso||asgDate(r.a); const di=SDAYS.findIndex(d=>isoOf(dateOf(d))===iso); if(di>=0) asgChipsByDay[SDAYS[di]].push(r); } }
  let minS=Infinity,maxE=-Infinity; events.forEach(ev=>{minS=Math.min(minS,ev.s);maxE=Math.max(maxE,ev.en);});
  for(const d of SDAYS) for(const b of asgBlocksByDay[d]){minS=Math.min(minS,b.s);maxE=Math.max(maxE,b.en);}
  if(!isFinite(minS)){minS=8*60;maxE=18*60;}
  const startH=Math.floor(minS/60),endH=Math.ceil(maxE/60);
  const byDay={}; SDAYS.forEach(d=>byDay[d]=[]); events.forEach(ev=>byDay[ev.day].push(ev));
  for(const dd of SDAYS){ const list=byDay[dd].sort((a,b)=>a.s-b.s||a.en-b.en); let i=0;
    while(i<list.length){ let j=i,ce=list[i].en; const cl=[list[i]]; while(j+1<list.length&&list[j+1].s<ce){j++;cl.push(list[j]);ce=Math.max(ce,list[j].en);}
      const cc=[]; for(const ev of cl){ let pl=false; for(let c=0;c<cc.length;c++){ if(cc[c]<=ev.s){ ev.col=c; cc[c]=ev.en; pl=true; break; } } if(!pl){ ev.col=cc.length; cc.push(ev.en); } } cl.forEach(ev=>ev.ncols=cc.length); i=j+1; } }
  const credits=es.reduce((s,e)=>s+num(e.credits),0);
  const wk=weekMon?(()=>{const o={};SDAYS.forEach(d=>{const D=dateOf(d);o[d]=(D.getMonth()+1)+"/"+D.getDate();});return o;})():null;
  const adByDay=weekMon?(()=>{const o={};SDAYS.forEach(d=>{const D=dateOf(d);o[d]=ac.overlay.filter(x=>D>=x.s&&D<=x.e);});return o;})():null;
  return {term,es,events,byDay,startH,endH,credits,wk,adByDay,asgChipsByDay,asgBlocksByDay,titleSub:weekMon?weekLabel(weekMon):null};
}
// Decode a data: URL to a Blob *synchronously* — keeps us inside the click gesture
// so iOS lets navigator.share attach the PNG to a text (async toBlob would break it).
function dataURLtoBlob(durl){
  const c=durl.indexOf(','), mime=(durl.slice(0,c).match(/:(.*?);/)||[])[1]||'image/png';
  const bin=atob(durl.slice(c+1)), n=bin.length, u8=new Uint8Array(n);
  for(let i=0;i<n;i++) u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:mime});
}
// Ask which snapshot to share: the specific visible week (with dates) or the generic weekly layout.
function openShareChooser(){ openModal($("#shareModal")); }
// weekMon: a Monday Date for the week snapshot, or null for the generic "typical week".
function shareSchedule(weekMon){
  closeModal($("#shareModal"));
  const cv=buildSchedCanvas(SCHED_TERM, weekMon);
  if(!cv){ toast(weekMon?"No classes to show for this week":"No class times to show for this term"); return; }
  const term=termById(SCHED_TERM);
  const tag=weekMon?('-'+weekLabel(weekMon).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()):'';
  const name=`carnelian-${(term?term.name:'schedule').replace(/\s+/g,'-').toLowerCase()}${tag}.png`;
  let blob; try{ blob=dataURLtoBlob(cv.toDataURL('image/png')); }
  catch(e){ toast("Couldn't render image"); return; }
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    // Called synchronously within the gesture; only fall back if the share truly fails.
    navigator.share({files:[file]}).catch(e=>{ if(!(e&&e.name==='AbortError')) downloadBlob(blob,name); });
    return;
  }
  downloadBlob(blob,name);
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); toast("Image saved");
}
// Resolve the exact themed colours the CSS paints for a block of a given hue by
// probing a real .ev element — so the exported PNG matches the on-screen grid in
// whatever theme is active (solid in light, tinted in dark) instead of a fixed look.
function evColors(hue){
  const probe=document.createElement('div'); probe.className='ev';
  probe.style.cssText='position:absolute;left:-9999px;top:-9999px;width:60px;height:60px;--h:'+hue;
  const c=document.createElement('div'); c.className='c'; probe.appendChild(c);
  const m=document.createElement('div'); m.className='m'; probe.appendChild(m);
  const lc=document.createElement('div'); lc.className='loc'; probe.appendChild(lc);
  document.body.appendChild(probe);
  const ps=getComputedStyle(probe);
  const out={ bg:ps.backgroundColor, border:ps.borderTopColor, bar:ps.borderLeftColor,
              title:getComputedStyle(c).color, meta:getComputedStyle(m).color, loc:getComputedStyle(lc).color };
  document.body.removeChild(probe);
  return out;
}
function buildSchedCanvas(termId, weekMon){
  const d=schedImageData(termId, weekMon);
  const anyAsg=SDAYS.some(dd=>((d.asgBlocksByDay&&d.asgBlocksByDay[dd])||[]).length||((d.asgChipsByDay&&d.asgChipsByDay[dd])||[]).length);
  if(!d.events.length && !anyAsg){ return null; }
  const cs=getComputedStyle(document.body), v=n=>(cs.getPropertyValue(n)||'').trim()||'#000000';
  const surface=v('--surface'), ink=v('--ink'), ink2=v('--ink-2'), ink3=v('--ink-3'), line=v('--line'), surface2=v('--surface-2');
  const accent=v('--accent'), accentSoft=v('--accent-soft'), accentLine=v('--accent-line');
  const S=2, pad=16, gutter=48, colW=152, headH=64, hourH=54; const dayH=d.wk?38:30;
  const rows=d.endH-d.startH, total=rows*60, gStart=d.startH*60, gridH=rows*hourH;
  const W=gutter+colW*5+pad;
  // academic-dates band (week mode only): full, wrapped, never truncated — grows the image as needed
  const adBy=d.adByDay||{}, asgBy=d.asgChipsByDay||{}; const bandFont=10, bandLH=13, boxPadX=6, boxPadY=4, boxGap=5, bandPad=7;
  const bandLines={}; let bandH=0;
  if(d.wk && SDAYS.some(dd=>(adBy[dd]||[]).length||(asgBy[dd]||[]).length)){
    const mc=document.createElement('canvas').getContext('2d');
    mc.font=`700 ${bandFont}px -apple-system,system-ui,sans-serif`;
    let maxH=0;
    SDAYS.forEach(dd=>{ let h=0; bandLines[dd]=[];
      for(const o of (adBy[dd]||[])){ const lines=wrapLines(mc, acalShort(o.title), colW-8-boxPadX*2);
        bandLines[dd].push({kind:'ac',o,lines}); h += lines.length*bandLH + boxPadY*2 + boxGap; }
      for(const r of (asgBy[dd]||[])){ const lines=wrapLines(mc, asgTitle(r.a), colW-8-boxPadX*2-10);
        bandLines[dd].push({kind:'asg',r,lines}); h += lines.length*bandLH + boxPadY*2 + boxGap; }
      maxH=Math.max(maxH,h); });
    if(maxH>0) bandH=maxH - boxGap + bandPad*2;
  }
  const H=headH+dayH+bandH+gridH+pad;
  const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
  const x=cv.getContext('2d'); x.scale(S,S);
  x.fillStyle=surface; x.fillRect(0,0,W,H);
  x.textBaseline='alphabetic'; x.textAlign='left';
  x.fillStyle=ink; x.font='800 22px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';
  x.fillText(d.term?d.term.name:'Schedule', pad, 36);
  x.fillStyle=ink3; x.font='700 12.5px -apple-system,system-ui,sans-serif';
  x.fillText(`${d.es.length} course${d.es.length===1?'':'s'} · ${nf(d.credits)} credits${d.titleSub?'   ·   '+d.titleSub:''}`, pad, 54);
  const gx0=gutter, gy0=headH+dayH+bandH;
  x.fillStyle=surface2; x.fillRect(pad,headH,W-pad*2,dayH);
  x.textAlign='center'; x.textBaseline='middle';
  SDAYS.forEach((dd,i)=>{ const cx=gx0+colW*i+colW/2;
    if(d.wk){ x.fillStyle=ink2; x.font='800 12px -apple-system,system-ui,sans-serif'; x.fillText(SDAY_LABEL[dd], cx, headH+dayH/2-6);
      x.fillStyle=ink3; x.font='700 10px -apple-system,system-ui,sans-serif'; x.fillText(d.wk[dd], cx, headH+dayH/2+8); }
    else { x.fillStyle=ink2; x.font='800 12px -apple-system,system-ui,sans-serif'; x.fillText(SDAY_LABEL[dd], cx, headH+dayH/2); } });
  // academic-dates band: one wrapped, full-text box per event, stacked per day column
  if(bandH){ const bandY=headH+dayH;
    x.fillStyle=surface2; x.fillRect(pad,bandY,W-pad*2,bandH);
    x.textAlign='left'; x.textBaseline='top';
    SDAYS.forEach((dd,i)=>{ let yy=bandY+bandPad; const bx=gx0+colW*i+4, bw=colW-8;
      for(const it of (bandLines[dd]||[])){ const boxH=it.lines.length*bandLH+boxPadY*2;
        if(it.kind==='asg'){ const a=it.r.a;
          roundRectPath(x,bx,yy,bw,boxH,5); x.fillStyle=surface; x.fill();
          x.strokeStyle=line; x.lineWidth=1; roundRectPath(x,bx+0.5,yy+0.5,bw-1,boxH-1,5); x.stroke();
          x.fillStyle=it.r.color; x.fillRect(bx, yy, 3, boxH);
          x.fillStyle=a.done?ink3:ink2; x.font=`700 ${bandFont}px -apple-system,system-ui,sans-serif`;
          it.lines.forEach((ln,li)=>x.fillText(ln, bx+boxPadX+4, yy+boxPadY+li*bandLH));
          if(a.done){ x.strokeStyle=ink3; x.lineWidth=1; const sy=yy+boxPadY+bandFont/2; x.beginPath(); x.moveTo(bx+boxPadX+4,sy); x.lineTo(bx+boxPadX+4+Math.min(x.measureText(it.lines[0]||'').width,bw-boxPadX*2-4),sy); x.stroke(); }
          yy+=boxH+boxGap; continue; }
        roundRectPath(x,bx,yy,bw,boxH,5); x.fillStyle=it.o.noclass?accentSoft:surface; x.fill();
        x.strokeStyle=it.o.noclass?accentLine:line; x.lineWidth=1; roundRectPath(x,bx+0.5,yy+0.5,bw-1,boxH-1,5); x.stroke();
        x.fillStyle=it.o.noclass?accent:ink2; x.font=`${it.o.noclass?'800':'700'} ${bandFont}px -apple-system,system-ui,sans-serif`;
        it.lines.forEach((ln,li)=>x.fillText(ln, bx+boxPadX, yy+boxPadY+li*bandLH));
        yy+=boxH+boxGap; } }); }
  x.strokeStyle=line; x.lineWidth=1; x.textAlign='right'; x.font='700 10px -apple-system,system-ui,sans-serif';
  for(let hh=d.startH; hh<=d.endH; hh++){ const gy=gy0+((hh*60-gStart)/total)*gridH;
    x.beginPath(); x.moveTo(gx0,Math.round(gy)+0.5); x.lineTo(W-pad,Math.round(gy)+0.5); x.stroke();
    if(hh<d.endH){ x.fillStyle=ink3; x.textBaseline='middle'; x.fillText(min2label(hh*60), gx0-6, gy+13); } }
  for(let i=0;i<=5;i++){ const cxp=gx0+colW*i; x.beginPath(); x.moveTo(Math.round(cxp)+0.5,gy0); x.lineTo(Math.round(cxp)+0.5,gy0+gridH); x.stroke(); }
  x.textAlign='left';
  const ecCache={}, EC=h=>ecCache[h]||(ecCache[h]=evColors(h));
  SDAYS.forEach((dd,di)=>{ for(const ev of d.byDay[dd]){
    const bw=colW/ev.ncols, bx=gx0+colW*di+ev.col*bw+2, by=gy0+((ev.s-gStart)/total)*gridH+1, bh=Math.max(15,((ev.en-ev.s)/total)*gridH-2), W2=bw-4;
    const ec=EC(SCHED_COLORS[ev.ci]);
    roundRectPath(x,bx,by,W2,bh,6); x.fillStyle=ec.bg; x.fill();
    x.strokeStyle=ec.border; x.lineWidth=1; roundRectPath(x,bx+0.5,by+0.5,W2-1,bh-1,6); x.stroke();
    roundRectPath(x,bx,by,4,bh,2); x.fillStyle=ec.bar; x.fill();
    x.save(); roundRectPath(x,bx,by,W2,bh,6); x.clip();
    x.textAlign='center'; const tx=bx+2+W2/2; x.textBaseline='top';   // centred to match the on-screen block (+2 offsets the 4px accent bar)
    x.fillStyle=ec.title; x.font='800 12px -apple-system,system-ui,sans-serif'; x.fillText(ev.e.code||'—', tx, by+5);
    if(bh>=30){ x.fillStyle=ec.meta; x.font='700 10px -apple-system,system-ui,sans-serif'; x.fillText(min2label(ev.s)+' – '+min2label(ev.en), tx, by+21); }
    if(bh>=46 && ev.m.location){ x.fillStyle=ec.loc; x.font='600 10px -apple-system,system-ui,sans-serif'; x.fillText(ev.m.location, tx, by+34); }
    // Half-term (H1/H2) + TA/Audit tags share one bottom-right line, matching the on-screen block
    // (skipped on narrow/conflict columns with no room).
    const _cr=roleOf(ev.e), rtag=_cr==='audit'?'AUDIT':(_cr==='ta_paid'||_cr==='ta_credit')?'TA':'';
    const _hp=partOf(ev.m), htag=_hp==='1'?'H1':_hp==='2'?'H2':'';
    const tagStr=(ev.ncols===1)?[htag,rtag].filter(Boolean).join(' · '):'';
    if(tagStr){ x.textAlign='right'; x.textBaseline='alphabetic'; x.fillStyle=ec.title; x.font='800 9px -apple-system,system-ui,sans-serif'; x.fillText(tagStr, bx+W2-6, by+bh-6); }
    x.restore();
  }});
  // timed assignment blocks (exam/quiz): dashed "assessment" boxes over the class grid
  SDAYS.forEach((dd,di)=>{ for(const b of ((d.asgBlocksByDay&&d.asgBlocksByDay[dd])||[])){ const a=b.a;
    const bx=gx0+colW*di+2, by=gy0+((b.s-gStart)/total)*gridH+1, bh=Math.max(15,((b.en-b.s)/total)*gridH-2), W2=colW-4;
    x.save();
    roundRectPath(x,bx,by,W2,bh,6); x.fillStyle=surface; x.fill();
    x.globalAlpha=a.done?0.10:0.16; x.fillStyle=b.color; roundRectPath(x,bx,by,W2,bh,6); x.fill(); x.globalAlpha=1;
    x.strokeStyle=b.color; x.lineWidth=1.4; x.setLineDash([4,3]); roundRectPath(x,bx+0.7,by+0.7,W2-1.4,bh-1.4,6); x.stroke(); x.setLineDash([]);
    roundRectPath(x,bx,by,W2,bh,6); x.clip();
    x.textAlign='center'; const tx=bx+W2/2; x.textBaseline='top';   // centred to match the on-screen assessment block
    x.fillStyle=b.color; x.font='800 9px -apple-system,system-ui,sans-serif'; x.fillText(((_ASG_K[a.kind]||{}).label||'').toUpperCase(), tx, by+5);
    if(bh>=26){ x.fillStyle=a.done?ink3:ink; x.font='800 11px -apple-system,system-ui,sans-serif'; x.fillText(asgTitle(a), tx, by+16); }
    x.restore();
  }});
  return cv;
}
