  if(q!==$("#mCode").value.trim().toUpperCase()) return; // stale
  if(!classes){ res.classList.remove("on"); return; }
  const rest=parts.slice(1).join(" ");
  let ms=classes.filter(c=>!rest||(c.catalogNbr||"").startsWith(rest)||((c.catalogNbr+" "+(c.titleLong||"")).toUpperCase().includes(rest))).slice(0,40);
  MRESULTS=ms;
  if(!ms.length){ res.classList.remove("on"); return; }
  res.innerHTML=ms.map((c,i)=>{const eg=(c.enrollGroups||[])[0]||{};return `<div class="result" data-ri="${i}"><span class="rc">${esc(sub)} ${esc(c.catalogNbr)}</span><span class="rt">${esc(c.titleLong||'')}</span><span class="rr">${eg.unitsMaximum!=null?esc(String(eg.unitsMaximum))+' cr':''}</span></div>`;}).join("");
  res.querySelectorAll("[data-ri]").forEach(b=>b.onclick=()=>pickResult(MRESULTS[+b.dataset.ri],sub));
  res.classList.add("on");
}
function pickResult(cls,sub){ const secs=sectionsOf(cls);
  if(secs.length>1){ showSectionPicker(cls,sub,secs); return; }
  fillFromSection(cls,sub,secs[0]||null); }
function showSectionPicker(cls,sub,secs){ const res=$("#mResults");
  res.innerHTML=`<div class="result rhead">${esc(sub)} ${esc(cls.catalogNbr)} · choose your section</div>`+
    secs.map((sc,i)=>{ const m=(sc.s.meetings||[])[0]; const when=m?fmtRosterWhen(m):"No set meeting time";
      return `<div class="result secopt" data-si="${i}">
        <div class="so-top"><span class="rc">${esc(sc.section)}</span><span class="so-topic">${esc(sc.topic||cls.titleLong||'')}</span><span class="rr">${sc.credits!=null?esc(String(sc.credits))+' cr':''}</span></div>
        <div class="so-when">${esc(when)}</div></div>`;
    }).join("");
  res.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>fillFromSection(cls,sub,secs[+b.dataset.si]));
  res.classList.add("on"); $("#mLookupMsg").textContent="Multiple sections — pick the one you're in. Its time fills the meeting-times box below."; }
function fillFromSection(cls,sub,sc){ const eg=(cls.enrollGroups||[])[0]||{};
  $("#mCode").value=sub+" "+cls.catalogNbr;
  $("#mTitleIn").value=(sc&&sc.topic)||cls.titleLong||"";
  const cr=(sc&&sc.credits!=null)?sc.credits:eg.unitsMaximum; if(cr!=null)$("#mCredits").value=cr;
  classTags(cls).forEach(t=>{if(!MTAGS.includes(t))MTAGS.push(t);}); renderTagChips();
  const term=termById($("#mTerm").value); let halfN=0;
  const mtgs=sc?meetingsFromSection(sc.s):meetingsFromClass(cls);
  mtgs.forEach(m=>{ m.part=detectPart(m.sd,m.ed,term); if(m.part!=='full')halfN++; delete m.sd; delete m.ed; });
  let msg;
  if(mtgs.length){ MMEET=mtgs; msg="Filled from roster · "+(sc&&sc.section?("section "+sc.section+" · "):"")+mtgs.length+" meeting"+(mtgs.length===1?"":"s")+(halfN?" · half-term":""); }
  else { MMEET=[]; msg="Filled from roster"+(sc&&sc.section?(" · section "+sc.section+" has no set meeting time"):" · no set meeting time"); }
  renderMeetRows();
  $("#mResults").classList.remove("on"); $("#mLookupMsg").textContent=msg; }
$("#mCode").addEventListener("input",()=>{ const el=$("#mCode"); const p=el.selectionStart; el.value=el.value.toUpperCase(); try{el.setSelectionRange(p,p);}catch(e){} clearTimeout(searchTimer); searchTimer=setTimeout(runSearch,240); });
$("#mCode").addEventListener("blur",()=>setTimeout(()=>$("#mResults").classList.remove("on"),200));
// clicking a result/section must not blur the Code field (which would auto-hide the dropdown before the click lands)
$("#mResults").addEventListener("mousedown",e=>e.preventDefault());
$("#mTerm").addEventListener("change",()=>{ if($("#mCode").value.trim().length>=2){ clearTimeout(searchTimer); searchTimer=setTimeout(runSearch,60); } });
async function rosterLookup(code){
  const parts=code.trim().toUpperCase().split(/\s+/); if(parts.length<2) return null; const sub=parts[0], nbr=parts[1];
  for(const roster of ["FA26","SP26","FA25","SP25","FA24"]){
    try{ const r=await fetch(`https://classes.cornell.edu/api/2.0/search/classes.json?roster=${roster}&subject=${sub}`);
      const j=await r.json(); if(j.status!=="success") continue;
      const cls=(j.data.classes||[]).find(c=>c.catalogNbr===nbr); if(!cls) continue;
      const eg=(cls.enrollGroups||[])[0]||{}; let tags=[];
      if(cls.crseAttrValueGroups&&cls.crseAttrValueGroups.length) cls.crseAttrValueGroups.forEach(g=>(g.crseAttrValues||"").split(",").forEach(v=>{const t=v.replace(/[()\s]/g,"");if(t)tags.push(t);}));
      else if(cls.catalogDistr) cls.catalogDistr.replace(/[()]/g," ").split(/[,\s]+/).forEach(t=>{if(t)tags.push(t);});
      return {title:cls.titleLong, credits:eg.unitsMaximum, tags, roster};
    }catch(e){}
  }
  return null;
}
let SAVING=false;
$("#mSave").onclick=async()=>{
  if(SAVING) return; SAVING=true; const btn=$("#mSave"); btn.classList.add("busy");
  const grade=$("#mGrade").value;
  const meetings=MMEET.map(m=>({component:(m.component||"").trim(),section:(m.section||"").trim(),
      days:SDAYS.filter(d=>(m.days||[]).includes(d)),start:m.start||"",end:m.end||"",location:(m.location||"").trim(),instructor:(m.instructor||"").trim(),part:partOf(m)}))
    .filter(m=>m.days.length&&hm2min(m.start)!=null&&hm2min(m.end)!=null&&hm2min(m.end)>hm2min(m.start));
  const row={ code:$("#mCode").value.trim().toUpperCase(), title:$("#mTitleIn").value.trim(), credits:num($("#mCredits").value),
    term_id:$("#mTerm").value||null, status:$("#mStatus").value, grade:grade||null, counts_gpa:GRADE_POINTS[grade]!=null,
    tags:MTAGS.slice(), analog_of:$("#mAnalog").value.trim()||null, in_as:$("#mInAs").checked, meetings };
  if(EDIT_ID!=null) row.id=EDIT_ID;
  const want=new Set([...$("#mSat").querySelectorAll("input:checked")].map(c=>c.dataset.req));
  try{
    const saved=(await api("upsert",{table:"enrollments",row})).row;
    if(EDIT_ID!=null){ const i=DB.enrollments.findIndex(x=>String(x.id)===String(EDIT_ID)); DB.enrollments[i]=saved; } else DB.enrollments.push(saved);
    // course itself is saved — close immediately so it never feels laggy
    closeModal($("#modal")); renderAll(); toast("Saved");
    // reconcile requirement mappings in the background
    const eid=saved.id;
    const have=(DB.satisfactions||[]).filter(s=>String(s.enrollment_id)===String(eid));
    const haveSet=new Set(have.map(s=>s.requirement_id)); let touched=false;
    for(const s of have) if(!want.has(s.requirement_id)){ await api("delete",{table:"satisfactions",id:s.id}); DB.satisfactions=DB.satisfactions.filter(x=>x.id!==s.id); touched=true; }
    for(const rid of want) if(!haveSet.has(rid)){ const r=(await api("upsert",{table:"satisfactions",row:{enrollment_id:eid,requirement_id:rid}})).row; (DB.satisfactions=DB.satisfactions||[]).push(r); touched=true; }
    if(touched) renderAll();
  }catch(err){ toast(err.message||"Error"); }
  finally{ SAVING=false; btn.classList.remove("busy"); }
};
$("#mDelete").onclick=()=>{ if(EDIT_ID==null) return;
  confirmDelete("Delete this course?", $("#mCode").value||"This course", async()=>{
    try{ await api("delete",{table:"enrollments",id:EDIT_ID}); DB.enrollments=DB.enrollments.filter(x=>String(x.id)!==String(EDIT_ID)); DB.satisfactions=(DB.satisfactions||[]).filter(s=>String(s.enrollment_id)!==String(EDIT_ID)); closeModal($("#modal")); renderAll(); toast("Deleted"); }catch(err){ toast(err.message||"Error"); } }); };

/* ---- requirement modal ---- */
let R_EDIT=null;
function openReq(id=null){
  R_EDIT=id; const r=id!=null?DB.requirements.find(x=>x.id===id):null; const spec=(r&&r.spec)||{}, m=spec.match||{};
  $("#rTitle").textContent=id!=null?"Edit requirement":"Add requirement";
  $("#rProg").innerHTML=DB.programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  $("#rProg").value=r?r.program_id:(topPrograms()[0]||{}).id;
  fillParents(); $("#rProg").onchange=fillParents;
  $("#rParent").value=r&&r.parent_id?r.parent_id:"";
  $("#rName").value=r?r.name:"";
  const kind=spec.need?spec.need.type:"credits"; $("#rKind").value=kind;
  $("#rNeed").value=spec.need?spec.need.n:"";
  let mt="none"; if(m.attribute)mt="attribute"; else if(m.subject)mt="subject"; else if(m.codes)mt="codes"; else if(m.scope)mt="scope";
  $("#rMatchType").value=mt;
  $("#rAttr").value=m.attribute||""; $("#rSubj").value=m.subject||""; $("#rLmin").value=m.levelMin||""; $("#rLmax").value=m.levelMax||"";
  $("#rX9").checked=!!(spec.exclude&&spec.exclude.x9xx); $("#rCodes").value=(m.codes||[]).join(", "); $("#rScope").value=m.scope||"as";
  syncMatchUI();
  ["rProg","rParent","rKind","rMatchType","rScope"].forEach(x=>syncDD($("#"+x)));
  $("#rDelete").style.display=id!=null?"inline-block":"none";
  openModal($("#rmodal"));
}
function fillParents(){ const pid=$("#rProg").value; const opts=DB.requirements.filter(r=>r.program_id===pid&&r.id!==R_EDIT);
  $("#rParent").innerHTML=`<option value="">— top level —</option>`+opts.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join(""); syncDD($("#rParent")); }
function syncMatchUI(){ const k=$("#rKind").value, mt=$("#rMatchType").value;
  $("#rMatchWrap").style.display=k==="flag"?"none":"grid";
  ["attribute","subject","codes","scope"].forEach(x=>$("#rMV_"+x).style.display=(k!=="flag"&&mt===x)?(x==="subject"?"block":"grid"):"none");
}
$("#rKind").onchange=syncMatchUI; $("#rMatchType").onchange=syncMatchUI;
$("#rClose").onclick=()=>closeModal($("#rmodal"));
$("#rCancel").onclick=()=>closeModal($("#rmodal"));
$("#rmodal").addEventListener("click",e=>{ if(e.target===$("#rmodal")) closeModal($("#rmodal")); });
$("#rSave").onclick=async()=>{
  const kind=$("#rKind").value, n=num($("#rNeed").value)||(kind==="flag"?1:1);
  const spec={need:{type:kind,n}};
  if(kind!=="flag"){ const mt=$("#rMatchType").value, m={};
    if(mt==="attribute"&&$("#rAttr").value.trim()) m.attribute=$("#rAttr").value.trim();
    else if(mt==="subject"){ m.subject=$("#rSubj").value.trim().toUpperCase(); if($("#rLmin").value)m.levelMin=parseInt($("#rLmin").value); if($("#rLmax").value)m.levelMax=parseInt($("#rLmax").value); if($("#rX9").checked)spec.exclude={x9xx:true}; }
    else if(mt==="codes"&&$("#rCodes").value.trim()) m.codes=splitList($("#rCodes").value).map(s=>s.toUpperCase());
    else if(mt==="scope") m.scope=$("#rScope").value;
    else m.manual=true;
    spec.match=m;
  }
  const prog=$("#rProg").value;
  const sibs=DB.requirements.filter(r=>r.program_id===prog); const sort=R_EDIT?(DB.requirements.find(r=>r.id===R_EDIT).sort):(sibs.length?Math.max(...sibs.map(s=>s.sort||0))+1:1);
  const row={ program_id:prog, parent_id:$("#rParent").value||null, name:$("#rName").value.trim()||"Requirement", kind:kind==="credits"?"credits":(kind==="flag"?"flag":kind), credits_required:kind==="credits"?n:null, count_required:kind==="courses"?n:null, sort, spec };
  if(R_EDIT) row.id=R_EDIT; else row.id=prog+"-"+Date.now().toString(36);
  try{ const saved=(await api("upsert",{table:"requirements",row})).row;
    const i=DB.requirements.findIndex(x=>x.id===saved.id); if(i>=0)DB.requirements[i]=saved; else DB.requirements.push(saved);
    closeModal($("#rmodal")); renderAll(); toast("Requirement saved");
  }catch(err){ toast(err.message||"Error"); }
};
$("#rDelete").onclick=()=>{ if(R_EDIT==null) return;
  confirmDelete("Delete this requirement?", $("#rName").value||"This requirement", async()=>{
    try{ await api("delete",{table:"requirements",id:R_EDIT}); DB.requirements=DB.requirements.filter(x=>x.id!==R_EDIT); closeModal($("#rmodal")); renderAll(); toast("Deleted"); }catch(err){ toast(err.message||"Error"); } }); };

/* ---- nav / theme / zoom ---- */
function showPage(id){ const changed=CUR!==id; CUR=id; document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id)); document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("on",n.dataset.nav===id));
  const main=document.querySelector(".main"); if(main) main.classList.toggle("fit", id==="schedule");
  if(changed && id!=="planner") scrollTo(0,0);
  updateFab();
  if(id==="schedule") requestAnimationFrame(fitSchedule);
  if(id==="planner" && changed) requestAnimationFrame(centerPlannerTerm);
}
// On opening the planner, bring the current term to the vertical middle of the view
// (the browser clamps naturally when it's the first or last section).
function centerPlannerTerm(){
  const p=$("#planner"); if(!p){ scrollTo(0,0); return; }
  const el=p.querySelector(".pterm.now")||p.querySelector(".pterm:not(.past):not(.aux)");
  if(el) el.scrollIntoView({block:"center",behavior:"auto"}); else scrollTo(0,0);
}
// floating add button — contextual to the page, so you never scroll up to add
const FAB_ACT={ planner:()=>openCourse(), requirements:()=>openReq() };
function updateFab(){ const f=$("#fab"); if(!f) return; const act=FAB_ACT[CUR];
  if(act){ f.style.display="flex"; f.onclick=act; } else f.style.display="none"; }
document.querySelectorAll("[data-nav]").forEach(n=>n.addEventListener("click",()=>showPage(n.dataset.nav)));
const root=document.documentElement, mq=matchMedia("(prefers-color-scheme: dark)");
{ const savedTheme=localStorage.getItem("carn_theme"); if(savedTheme) root.setAttribute("data-theme",savedTheme); }
document.querySelectorAll(".js-theme").forEach(b=>b.addEventListener("click",()=>{const c=root.getAttribute("data-theme")||(mq.matches?"dark":"light");const nt=c==="dark"?"light":"dark";root.setAttribute("data-theme",nt);localStorage.setItem("carn_theme",nt);}));
window.openCourse=openCourse;

["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
$("#gateInput").addEventListener("input",()=>{ if($("#gateForm").dataset.mode==="login" && $("#gateInput").value.length===4) $("#gateForm").requestSubmit(); });
$("#gateInput2").addEventListener("input",()=>{ if($("#gateInput").value.length===4 && $("#gateInput2").value.length===4) $("#gateForm").requestSubmit(); });

// Register the network-first service worker so future updates always load fresh on reopen.
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
boot();
</script>
